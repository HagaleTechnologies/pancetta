[package]
name = "pancetta-hamlib"
description = "Hamlib integration and CAT control for amateur radio transceivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Internal dependencies
pancetta-core = { path = "../pancetta-core" }

# Workspace dependencies
tokio = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }

# Serialization for configuration

# Async utilities
async-trait = "0.1"

# Numeric types for frequency/power handling

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.27"
proptest = "1.11"
tracing-subscriber = { workspace = true }

[features]
default = ["mock-rig"]
# Mock rig implementation for testing without hardware
mock-rig = []

[lints]
workspace = true
