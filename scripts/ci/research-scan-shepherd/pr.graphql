query($owner: String!, $name: String!, $pr: Int!, $endCursor: String) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $pr) {
      number title state author { __typename login } isDraft isCrossRepository baseRefName
      createdAt headRefOid mergeable autoMergeRequest { enabledAt } isInMergeQueue
      labels(first: 100) { nodes { name } pageInfo { hasNextPage } }
      commits(last: 100) { nodes { commit { oid } } pageInfo { hasPreviousPage } }
      reviews(first: 100) { nodes { author { login } commit { oid } } pageInfo { hasNextPage } }
      reviewThreads(first: 100, after: $endCursor) {
        pageInfo { hasNextPage endCursor }
        nodes {
          id isResolved path
          opener: comments(first: 1) { nodes { author { __typename login } } }
          latest: comments(last: 1) { nodes { id author { __typename login } body url } }
        }
      }
    }
  }
}
