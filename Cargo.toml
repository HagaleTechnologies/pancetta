[workspace]
members = [
    "pancetta",
    "pancetta-agent",
    "pancetta-audio",
    "pancetta-config",
    "pancetta-core",
    "pancetta-cqdx",
    "pancetta-dsp",
    "pancetta-dx",
    "pancetta-ft8",
    "pancetta-hamlib",
    "pancetta-protocol",
    "pancetta-qso",
    "pancetta-research",
    "pancetta-tui",
]
default-members = [
    "pancetta",
    "pancetta-agent",
    "pancetta-config",
    "pancetta-core",
    "pancetta-cqdx",
    "pancetta-dsp",
    "pancetta-dx",
    "pancetta-ft8",
    "pancetta-hamlib",
    "pancetta-protocol",
    "pancetta-qso",
    "pancetta-tui",
]
resolver = "2"

[workspace.package]
version = "0.9.6"
edition = "2021"
rust-version = "1.98"
authors = ["Hagale Technologies, LLC"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/HagaleTechnologies/pancetta"
# The default for every crate: not publishable. pancetta-core and
# pancetta-ft8 opt in with their own `publish = true` (PAN-384) and publish
# together. Flipping this would make every crate publishable.
publish = false

[workspace.dependencies]
# Real-time audio processing
cpal = "0.18"
# Lock-free data structures for real-time communication
ringbuf = "0.6"
# Atomic operations for real-time coordination
atomic = "0.6"

# Async runtime and coordination
tokio = { version = "1.50", features = ["full", "rt-multi-thread"] }
futures = "0.3"
futures-util = "0.3"

# Inter-process communication
crossbeam-channel = "0.5"
flume = "0.11"
async-channel = "2.0"
parking_lot = "0.12"

# CLI and configuration
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Logging and telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# System utilities
uuid = { version = "1.23", features = ["v4", "serde"] }
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
dirs = "6"
num_cpus = "1.0"

# Signal handling
signal-hook = "0.3"

# HTTP client and networking
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2", "system-proxy", "json", "stream", "multipart", "cookies", "query", "form"] }
encoding_rs = "0.8"

# Geographic calculations
geo = "0.28"
geographiclib-rs = "0.2"

# Database support
rusqlite = { version = "0.32", features = ["bundled"] }

# XML parsing
quick-xml = "0.42"

# Regular expressions
regex = "1.12"

# URL parsing
url = "2.5"

# Encoding support
base64 = "0.23"

# TLS and WebSocket support
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }

# HTTP server and WebSocket upgrade (remote_gateway)
axum = { version = "0.8", features = ["ws"] }

# Statistical calculations
statrs = "0.17"

# Testing utilities
approx = "0.5"

[profile.release]
# Optimize for real-time performance
opt-level = 3
lto = true
codegen-units = 1
# `unwind` (not `abort`) so the FT8 decode loop can `catch_unwind` a panic in a
# single window — that window is logged + skipped and the station keeps running,
# instead of one bad decode aborting the whole process. The OS supervisor
# (packaging/systemd, packaging/launchd; see docs/RUNBOOK.md) remains the
# backstop for everything unwinding can't catch (notably a native ft8_lib C
# abort). The tiny unwinding-table size cost is worth unattended resilience.
panic = "unwind"
strip = true
overflow-checks = false
debug-assertions = false

# The TUI does layout arithmetic on terminal dimensions that can hit zero
# (terminal not yet sized, a remote/SSH session reporting 0×0 at launch).
# An unchecked `area.height - 2` underflow wraps silently in release →
# out-of-bounds render → SIGBUS ("bus error") instead of a catchable
# panic. The TUI is not on the decode hot path, so turn overflow checks
# back on for just this crate: a stray underflow becomes a clean unwind
# (logged, recoverable) rather than a hard process crash. Cost is
# negligible — the render loop is nowhere near CPU-bound.
[profile.release.package.pancetta-tui]
overflow-checks = true

[profile.dev]
# Fast compilation for development
opt-level = 1
# Keep line tables for local debugging and Cargo's incremental compilation for
# fast edit/build cycles. Catalyst disables incremental builds in its verify
# environment to stay within the PAN-85 20 GiB slot budget.
debug = "line-tables-only"
# Both dev and release use panic = "unwind" so panic handlers can run.
panic = "unwind"

[profile.test]
debug = "line-tables-only"

[profile.dev.package.pancetta-ft8]
opt-level = 3

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

[profile.bench]
# Optimized for benchmarking
opt-level = 3
lto = true
codegen-units = 1
debug = true

[workspace.lints.clippy]
too_many_arguments = "warn"
