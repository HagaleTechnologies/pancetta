# Exact Rust toolchain pin (same pin and rationale as manta MAN-36 / coppa).
#
# `channel = "stable"` resolved to whatever stable each machine last updated
# to, and CI's `dtolnay/rust-toolchain@stable` fetches the live stable on every
# run, so local builds and CI ran different compilers. On 2026-10-14 that broke
# local builds on macOS 27: stale local stables (1.94.1 on sophon, 1.96.1 on
# aldebaran) emit proc-macro dylibs that dyld refuses to load ("mis-aligned
# LINKEDIT string pool" on libsqlx_macros), while 1.98+ builds clean.
#
# rustup's cargo/rustc proxies read this file on every invocation, ahead of the
# user's default and of the toolchain a CI action installs, and auto-install it
# on first use. Every machine and CI lane therefore builds with this exact
# version. 1.98.0 matches the Catalyst runner image, so cloud runs don't
# download a second toolchain. Bump it deliberately, in its own PR, together
# with the `toolchain:` input in .github/workflows/release.yml (it installs the
# cross-compile targets into this exact version).
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
