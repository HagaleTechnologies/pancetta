[package]
name = "pancetta-agent"
description = "Remote-TX security agent for pancetta: arm-state gating, capability verification, device pairing, and audit trail"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
snow = "0.10"
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
ed25519-dalek = { version = "3", features = ["rand_core"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
sha2 = "0.11"
rand_core = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }
base64 = { workspace = true }

[dev-dependencies]
hex = "0.4"
