[package]
name = "pancetta-dsp"
description = "High-performance digital signal processing pipeline for amateur radio applications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Core dependencies
tokio = { version = "1.50", features = ["full"] }
async-trait = "0.1"
thiserror = "2.0"
tracing = "0.1"

# Signal processing
realfft = "3.3"
rubato = "5.0"  # High-quality resampling
biquad = "0.4"   # IIR filters

# Numerical computing
num-complex = "0.4"

# Synchronization
crossbeam-channel = "0.5"
parking_lot = "0.12"

[dev-dependencies]
tracing-subscriber = "0.3"
rand = "0.10"

[[example]]
name = "ft8_pipeline_demo"
required-features = []

[lints]
workspace = true
