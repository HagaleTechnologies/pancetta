name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Thursdays at 09:00 UTC
    - cron: '0 9 * * 4'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # c-cpp excluded: the only C source code lives in the
        # pancetta-ft8/vendor/ft8_lib submodule (upstream kgoba/ft8_lib).
        # GitHub's default CodeQL autobuild does not check out submodules,
        # so the extractor finds 0 source files and fails. Scanning
        # third-party library code is also low-value; the Rust wrapper is
        # covered by the 'rust' lane below.
        language: [actions, rust, python]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
