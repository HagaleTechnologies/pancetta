name: Auto-Merge Trigger

# Native merge-queue admission: retires the auto-queue half of .mergify.yml's
# pull_request_rules ("queue on green + threads resolved"). Mergify's own rule did two
# things at once -- (1) admitting a PR into its queue once every check-success/thread-
# resolved condition held, gated to an explicit author allowlist (thagale,
# catalyst-cloud-connector[bot], dependabot[bot] for non-breaking bumps only -- see
# .mergify.yml's own header comment for the full rationale), and (2) actually performing
# the merge. GitHub's native `merge_queue` ruleset rule replaces job (2), but has no
# author-based admission control of its own -- something still has to call `gh pr merge
# --auto` per PR. This job reproduces the SAME author allowlist Mergify already enforced,
# not a new or looser policy.
on:
  pull_request_target:
    branches: [main]
    # unlabeled: without it, a human removing the pause label (see below) to acknowledge
    # a handoff and let a PR proceed produces no event at all for this workflow -- the PR
    # stays permanently unarmed until some unrelated push/edit/manual merge happens to come
    # along. Scoped to exactly this one label in the job's own `if:` below.
    #
    # labeled: a maintainer can manually attach the pause label at any time, including on a
    # PR that was already armed by an earlier event -- nothing else reacts to that. This
    # label always wins over an existing arm; the job's own `if:` and step logic route a
    # matching `labeled` event straight to an unconditional disarm/dequeue, bypassing the
    # author allowlist below (an admission gate has no reason to block a DISARM).
    #
    # edited, scoped to a real base retarget only: `edited` fires on any PR edit --
    # title, body, labels, base -- but arming on it unconditionally could re-arm an
    # unchanged head that just failed merge-group CI for reasons unrelated to that edit.
    # `changes.base` is present on the edited event's payload only when the base branch
    # itself changed -- scoping to it closes this at the root.
    types: [opened, reopened, ready_for_review, synchronize, edited, unlabeled, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  auto-merge:
    if: |
      github.event.pull_request.draft == false &&
      (github.event.action != 'edited' || github.event.changes.base != null) &&
      (github.event.action != 'unlabeled' || github.event.label.name == 'queue-needs-human-review') &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'queue-needs-human-review') ||
        (
          github.event.pull_request.user.login == 'thagale' ||
          github.event.pull_request.user.login == 'catalyst-cloud-connector[bot]' ||
          (
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            !contains(github.event.pull_request.labels.*.name, 'needs-review')
          )
        )
      )
    runs-on: ubuntu-latest
    # Shared with queue-retry-handler.yml's own mutating job -- closes a TOCTOU race where
    # this job could read the pause label as absent and arm moments after queue-retry-
    # handler.yml handed the PR off to a human. `cancel-in-progress: false`: a shared
    # mutual-exclusion lock must let a queued run WAIT for the current holder to finish its
    # full read-decide-act sequence, never cancel it mid-mutation -- every step in both jobs
    # reads live state at execution time regardless, so a queued run isn't working from
    # stale data by the time its turn comes.
    #
    # NOT shared with any round-cap/review-count mechanism -- this repo has none today. If
    # one is ever added, do not simply fold it into this same lock without first checking
    # for the exact three-way eviction hazard this comment used to warn about elsewhere in
    # this fleet: GitHub retains only one pending run per concurrency group, so a third
    # simultaneous producer contending for the same lock can evict a still-actionable
    # pending run outright rather than merely delay it.
    concurrency:
      group: auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # CODEX_REVIEW_PAT, not GITHUB_TOKEN: a merge attributed to GITHUB_TOKEN suppresses
      # downstream push-triggered events (GitHub's anti-recursion guard) -- any push-
      # triggered workflow on main needs to fire for a queue-merged commit exactly like any
      # other push to main.
      #
      # The pause label is checked here, inside the run, via a fresh API fetch -- not in
      # this job's own `if:` -- because `github.event.pull_request.labels` is a webhook-
      # delivery-time snapshot, not a live read. If the label gets attached AFTER that
      # snapshot but before this step actually runs, the stale snapshot still reads "no
      # label" and this job would re-arm auto-merge on a PR already handed off to a human. A
      # job-level `if:` has no way to re-evaluate itself against live state right before its
      # steps run; only a fetch inside a step body can.
      - name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
        run: |
          # isInMergeQueue/mergeQueueEntry checked and dequeued too, everywhere below --
          # `gh pr merge --auto`'s own --help output distinguishes two outcomes: "if
          # required checks have not yet passed, auto-merge will be enabled" (what
          # autoMergeRequest tracks) vs "if required checks have passed, the pull request
          # will be added to the merge queue" (a DIFFERENT state that --disable-auto's own
          # docs never claim to affect). A PR whose checks already passed before a
          # pause/disarm attempt could be sitting in the actual queue with autoMergeRequest
          # already null -- checking that field alone would falsely report "disarmed" while
          # the PR remains eligible to merge.
          dequeue_and_disarm() {
            local repo="$1" pr="$2"
            local owner name queue_state pr_node_id in_queue
            owner="${repo%%/*}"; name="${repo##*/}"
            gh pr merge "$pr" --repo "$repo" --disable-auto >/dev/null 2>&1 || true
            queue_state=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $pr: Int!) {
                repository(owner: $owner, name: $name) { pullRequest(number: $pr) { id isInMergeQueue } }
              }' -f owner="$owner" -f name="$name" -F pr="$pr" 2>/dev/null)
            pr_node_id=$(printf '%s' "$queue_state" | jq -r '.data.repository.pullRequest.id')
            in_queue=$(printf '%s' "$queue_state" | jq -r '.data.repository.pullRequest.isInMergeQueue')
            if [ "$in_queue" = "true" ] && [ -n "$pr_node_id" ] && [ "$pr_node_id" != "null" ]; then
              gh api graphql -f query='mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' -f id="$pr_node_id" >/dev/null 2>&1 || true
            fi
          }
          still_armed_or_queued() {
            local repo="$1" pr="$2"
            local owner name state armed queued
            owner="${repo%%/*}"; name="${repo##*/}"
            state=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $pr: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $pr) { autoMergeRequest { enabledAt } isInMergeQueue }
                }
              }' -f owner="$owner" -f name="$name" -F pr="$pr" 2>/dev/null)
            armed=$(printf '%s' "$state" | jq -r '.data.repository.pullRequest.autoMergeRequest != null')
            queued=$(printf '%s' "$state" | jq -r '.data.repository.pullRequest.isInMergeQueue')
            [ "$armed" = "true" ] || [ "$queued" = "true" ]
          }

          # A maintainer can manually attach the pause label at any time, including on a PR
          # already armed by an earlier event -- this label always wins over an existing
          # arm: disarm/dequeue unconditionally and stop, without running the staleness/
          # re-arm logic below (which only applies to deciding whether to ARM, not to a
          # fresh manual pause).
          if [ "$EVENT_ACTION" = "labeled" ] && [ "$EVENT_LABEL" = "queue-needs-human-review" ]; then
            echo "::notice::queue-needs-human-review was just attached to PR #$PR -- disarming/dequeuing any auto-merge that was already armed from an earlier event."
            dequeue_and_disarm "$REPO" "$PR"
            if still_armed_or_queued "$REPO" "$PR"; then
              echo "::error::Could not fully disarm PR #$PR after queue-needs-human-review was attached -- refusing to report success while it remains armed or queued. Disarm by hand and confirm." >&2
              exit 1
            fi
            exit 0
          fi

          # Single-producer provenance: queue-retry-handler.yml is the ONLY thing that ever
          # attaches queue-needs-human-review as an automatic decision (a maintainer can
          # also attach it by hand, handled above via the `labeled` branch). Its marker
          # comment records the head SHA the pause covers -- if the PR's current head has
          # since moved past that SHA, the pause is stale and safe to clear.
          needs_human_is_stale() {
            local current_head_sha12="$1"
            local last_labeled_at marker_info marker_created_at recorded_sha12 raw
            if raw=$(gh api --paginate --slurp "repos/${REPO}/issues/${PR}/timeline" 2>/dev/null); then
              last_labeled_at=$(printf '%s' "$raw" | jq -r '(add // []) | [.[] | select(.event == "labeled" and .label.name == "queue-needs-human-review")] | if length > 0 then (last | .created_at) else "" end' 2>/dev/null)
            else
              last_labeled_at=""
            fi
            [ -z "$last_labeled_at" ] && return 1
            if raw=$(gh api --paginate --slurp "repos/${REPO}/issues/${PR}/comments" 2>/dev/null); then
              marker_info=$(printf '%s' "$raw" | jq -r '(add // []) | [.[] | select(.user.login == "github-actions[bot]") | select(.body | test("queue-retry-handler:queue-needs-human-review sha=[0-9a-f]{12}")) | [.created_at, (.body | capture("queue-retry-handler:queue-needs-human-review sha=(?<s>[0-9a-f]{12})").s)] | @tsv] | if length > 0 then last else "" end' 2>/dev/null)
            else
              marker_info=""
            fi
            [ -z "$marker_info" ] && return 1
            marker_created_at=$(cut -f1 <<< "$marker_info")
            recorded_sha12=$(cut -f2 <<< "$marker_info")
            [ -z "$recorded_sha12" ] && return 1
            [[ "$marker_created_at" < "$last_labeled_at" ]] && return 1
            [ "$recorded_sha12" = "$current_head_sha12" ] && return 1
            return 0
          }

          current_labels=$(gh api --paginate "repos/${REPO}/issues/${PR}/labels" --jq '.[].name')
          if grep -qxF "queue-needs-human-review" <<< "$current_labels"; then
            current_head_sha12=$(gh pr view "$PR" --repo "${REPO}" --json headRefOid --jq '.headRefOid[0:12]')
            if needs_human_is_stale "$current_head_sha12"; then
              echo "::notice::queue-needs-human-review on PR #$PR is stale (tied to an earlier revision's queue-retry-handler pause, not the current head $current_head_sha12) -- clearing it and proceeding to arm auto-merge for the new revision."
              gh api --method DELETE "repos/${REPO}/issues/${PR}/labels/queue-needs-human-review" >/dev/null 2>&1 || true
              # Verify the delete actually took before arming -- the native queue has no
              # label condition of its own, so a transient DELETE failure must not fall
              # through to arming while the pause label remains visibly attached.
              labels_after_delete=$(gh api --paginate "repos/${REPO}/issues/${PR}/labels" --jq '.[].name')
              if grep -qxF "queue-needs-human-review" <<< "$labels_after_delete"; then
                echo "::error::Could not remove the stale queue-needs-human-review label from PR #$PR -- refusing to arm while it remains attached. Remove it by hand, then rerun this job." >&2
                exit 1
              fi
              gh pr merge "$PR_URL" --auto --squash
            else
              echo "::notice::PR #$PR has queue-needs-human-review covering its current head (or its provenance could not be confirmed) -- standing down without re-arming auto-merge."
            fi
          else
            gh pr merge "$PR_URL" --auto --squash
          fi
