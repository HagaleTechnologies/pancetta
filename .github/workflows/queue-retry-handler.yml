name: Queue Retry Handler

# GitHub's native merge queue dequeues a PR on a merge-group CI failure, but also fully
# disarms auto-merge -- and nothing else re-arms it, since auto-merge-trigger.yml only
# fires on discrete PR-lifecycle events, none of which occur just because a merge-group
# check completed. A PR can sit open indefinitely, silently, with clean PR-level status.
# This handler allows exactly ONE automatic retry per PR head SHA, then hands off to a
# human with a visible signal (the `queue-needs-human-review` label) if that retry also
# fails -- never an unbounded loop. It never touches code, dispatches tests directly, or
# deploys; its only mutating action is re-arming auto-merge on the PR's own
# already-reviewed candidate, re-requesting admission through the same gate that
# independently re-verifies everything from scratch.
#
# No author gating on the retry itself: auto-merge-trigger.yml's author allowlist governs
# who gets INITIAL admission, but a PR can also be manually admitted by a maintainer
# running `gh pr merge --auto` by hand for any author -- this handler retries whatever the
# native queue already accepted once, regardless of how it got there. The token used below
# (CODEX_REVIEW_PAT) is a real-user PAT that never invokes `--admin`/bypass semantics, so
# it carries no elevated merge power beyond what the queue itself already granted this PR.
#
# workflow_run, not check_run: GitHub does not fire check_run/check_suite events for a
# check suite that Actions itself created (anti-recursion) -- every check in this repo is
# Actions-created, so check_run would never fire here, for any of them, ever.
on:
  workflow_run:
    # CI and Supply Chain are the required checks a merge-group entry must pass. "Wait for
    # Codex Review" is excluded -- it never re-reviews a synthetic integration commit
    # (nothing to fail there structurally), so it's not a workflow this handler needs to
    # listen for a failed run on.
    workflows: ['CI', 'Supply Chain']
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Split into three jobs so the PR number (parsed from the merge-group branch name) can
  # reach a job-level `concurrency:` expression -- GitHub only allows `github`/`inputs`/
  # `vars`/`needs`/`strategy`/`matrix` contexts there, not `steps.*`, so the parse has to
  # live in its own job whose `outputs.*` are then visible via `needs.*.outputs.*`.
  parse-pr-number:
    if: |
      github.event.workflow_run.event == 'merge_group' &&
      (
        github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'cancelled' ||
        github.event.workflow_run.conclusion == 'timed_out' ||
        github.event.workflow_run.conclusion == 'startup_failure'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      pr_number: ${{ steps.parse.outputs.pr_number }}
    steps:
      - name: Parse PR number from the merge-group branch name
        id: parse
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # GitHub's merge-group synthetic branch naming convention:
          #   gh-readonly-queue/<base>/pr-<number>-<baseShaAtEnqueue>
          # The trailing SHA is the BASE branch's commit at enqueue time, NOT the PR's own
          # head -- deliberately not captured below, so nothing downstream can mistake it
          # for the PR's revision identity.
          if [[ "$HEAD_BRANCH" =~ ^gh-readonly-queue/([^/]+)/pr-([0-9]+)-[0-9a-f]+$ ]]; then
            pr_number="${BASH_REMATCH[2]}"
          else
            echo "::error::Could not parse merge-group branch name: $HEAD_BRANCH -- not a merge-group ref, or the naming convention changed. Exiting without action."
            exit 1
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

  # Deliberately NOT held under the shared auto-merge-<PR#> lock: this job's own debounce
  # below exists to give auto-merge-trigger.yml's independent run a chance to finish
  # acting on a freshly-pushed head before this handler decides whether the fetched head is
  # the one that actually failed. If this fetch+debounce were in the SAME job as the
  # mutating steps (which DO need the shared lock), a racing admission run couldn't just be
  # slow to complete during the debounce window -- it would be structurally unable to even
  # START until this whole job (holding the lock the entire time) finished, guaranteeing the
  # debounce always observes "not yet armed" and misreads a fresh, never-tested push as the
  # failed revision.
  check-pr-state:
    needs: [parse-pr-number]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      stale: ${{ steps.pr-state.outputs.stale }}
      head_sha: ${{ steps.pr-state.outputs.head_sha }}
      head_sha12: ${{ steps.pr-state.outputs.head_sha12 }}
    steps:
      - name: Fetch the PR's real head SHA and determine whether it's safe to act
        id: pr-state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.parse-pr-number.outputs.pr_number }}
        run: |
          # The merge-group branch name's trailing SHA is the base branch's commit at
          # enqueue time, not the PR's own head, and the merge-group's own synthetic commit
          # (squashed) can't recover it either -- fetch the PR's actual current head SHA
          # from the API instead.
          #
          # No timestamp-based "was this superseded" heuristic: every timestamp source is
          # unreliable in a different way (a force-pushed commit's own committer date is
          # pusher-controlled; the PR's updatedAt is self-referential, since this workflow's
          # own actions bump it). The retry-budget label below is already scoped to the
          # PR's CURRENT head SHA, fetched fresh here -- if a newer push landed, that new
          # SHA simply gets its own fresh retry budget, correct, UNLESS the current head was
          # never actually the one that failed (see the autoMergeRequest/isInMergeQueue
          # check below). Four checks are load-bearing: the PR must still be open, not a
          # draft, its base must still be main, and auto-merge must not already be
          # armed/queued on the current head.
          pr_json=$(gh pr view "$PR" --repo "${{ github.repository }}" --json state,headRefOid,baseRefName,isDraft,autoMergeRequest,author)
          pr_state=$(echo "$pr_json" | jq -r .state)
          head_sha=$(echo "$pr_json" | jq -r .headRefOid)
          base_ref=$(echo "$pr_json" | jq -r .baseRefName)
          is_draft=$(echo "$pr_json" | jq -r .isDraft)
          auto_merge_armed=$(echo "$pr_json" | jq -r '.autoMergeRequest != null')
          in_queue=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) { pullRequest(number: $pr) { isInMergeQueue } }
            }' -f owner="${REPO%%/*}" -f name="${REPO##*/}" -F pr="$PR" 2>/dev/null | jq -r '.data.repository.pullRequest.isInMergeQueue')
          [ "$auto_merge_armed" != "true" ] && [ "$in_queue" = "true" ] && auto_merge_armed="true"

          # Debounce before trusting a "disarmed" reading: the check above only catches the
          # race if auto-merge-trigger.yml's own separate run has ALREADY finished
          # re-arming a freshly-pushed head by the time we check -- there's no ordering
          # guarantee between these two independently-triggered workflows. Re-check once
          # after a short wait: if the head changed, or auto-merge became armed/queued in
          # the meantime, that's proof of the race. This narrows the window; it does not
          # close it -- bounded to a single missed automatic retry, not an unsafe merge.
          if [ "$pr_state" = "OPEN" ] && [ "$auto_merge_armed" != "true" ]; then
            sleep 10
            pr_json2=$(gh pr view "$PR" --repo "${{ github.repository }}" --json headRefOid,autoMergeRequest)
            head_sha2=$(echo "$pr_json2" | jq -r .headRefOid)
            auto_merge_armed2=$(echo "$pr_json2" | jq -r '.autoMergeRequest != null')
            in_queue2=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $pr: Int!) {
                repository(owner: $owner, name: $name) { pullRequest(number: $pr) { isInMergeQueue } }
              }' -f owner="${REPO%%/*}" -f name="${REPO##*/}" -F pr="$PR" 2>/dev/null | jq -r '.data.repository.pullRequest.isInMergeQueue')
            if [ "$head_sha2" != "$head_sha" ] || [ "$auto_merge_armed2" = "true" ] || [ "$in_queue2" = "true" ]; then
              auto_merge_armed=true
            fi
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha12=$(echo "$head_sha" | cut -c1-12)" >> "$GITHUB_OUTPUT"

          if [ "$pr_state" != "OPEN" ]; then
            echo "::notice::PR #$PR is no longer OPEN ($pr_state) -- nothing to act on."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          elif [ "$auto_merge_armed" = "true" ]; then
            echo "::notice::PR #$PR already shows auto-merge armed or queued -- a concurrent admission run likely won the race against this failure event. Standing down without consuming this head's retry budget."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          elif [ "$base_ref" != "main" ]; then
            echo "::notice::PR #$PR's base is '$base_ref', not main -- auto-merge-trigger.yml itself would refuse this base too. Standing down."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          elif [ "$is_draft" = "true" ]; then
            echo "::notice::PR #$PR is a draft -- standing down."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

  handle-merge-group-failure:
    needs: [parse-pr-number, check-pr-state]
    if: needs.check-pr-state.outputs.stale == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Shared with auto-merge-trigger.yml's own mutating job -- closes a TOCTOU race where
    # one could read the pause label as absent and arm moments after the other handed the
    # PR off to a human, or where both could act on the same head simultaneously.
    # `cancel-in-progress: false`: let a queued run WAIT for the current holder rather than
    # cancel it mid-mutation.
    #
    # Conditional group, not an unconditional shared one: a `stale == 'true'` run never
    # reaches this job at all (see the `if:` above) -- this job only exists for the
    # genuinely-actionable case, so routing it into the shared lock unconditionally is
    # correct here without the three-way eviction risk noted in auto-merge-trigger.yml's own
    # comment (there are only two producers contending for this specific lock, not three).
    concurrency:
      group: auto-merge-${{ needs.parse-pr-number.outputs.pr_number }}
      cancel-in-progress: false
    env:
      REPO: ${{ github.repository }}
      PR: ${{ needs.parse-pr-number.outputs.pr_number }}
      HEAD_SHA: ${{ needs.check-pr-state.outputs.head_sha }}
      HEAD_SHA12: ${{ needs.check-pr-state.outputs.head_sha12 }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      GH_TOKEN: ${{ github.token }}
      MERGE_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
    steps:
      - name: Deduplicate -- has this exact merge-group attempt already been handled?
        id: dedup
        env:
          MERGE_GROUP_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # 12-char short SHA: the full 40-char SHA would push the label name over GitHub's
          # 50-character limit. Matches the 12-char convention used for the retry-used
          # label below.
          ATTEMPT_LABEL="queue-attempt-handled:$(echo "$MERGE_GROUP_SHA" | cut -c1-12)"
          echo "attempt_label=$ATTEMPT_LABEL" >> "$GITHUB_OUTPUT"
          existing=$(gh api --paginate "repos/${REPO}/issues/${PR}/labels" --jq '.[].name' | sort -u)
          if grep -qxF "$ATTEMPT_LABEL" <<< "$existing"; then
            echo "already_handled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::This exact merge-group attempt ($MERGE_GROUP_SHA) was already handled -- likely a redelivered/duplicate event. No-op."
          else
            echo "already_handled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether this head already used its one automatic retry
        id: check-retried
        if: steps.dedup.outputs.already_handled == 'false'
        run: |
          RETRY_LABEL="queue-retry-used:${HEAD_SHA12}"
          existing=$(gh api --paginate "repos/${REPO}/issues/${PR}/labels" --jq '.[].name' | sort -u)
          if grep -qxF "$RETRY_LABEL" <<< "$existing"; then
            echo "already_retried=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_retried=false" >> "$GITHUB_OUTPUT"
          fi
          echo "retry_label=$RETRY_LABEL" >> "$GITHUB_OUTPUT"

      - name: Retry -- re-arm auto-merge for this head's one allowed attempt
        id: retry
        if: steps.dedup.outputs.already_handled == 'false' && steps.check-retried.outputs.already_retried == 'false'
        run: |
          # Re-check the base immediately before mutating: the debounce above only re-checks
          # head/auto-merge, not base -- a contributor could retarget the PR in that gap.
          current_base=$(gh pr view "$PR" --repo "${REPO}" --json baseRefName --jq .baseRefName)
          if [ "$current_base" != "main" ]; then
            echo "::notice::PR #$PR's base changed to '$current_base' since pr-state ran -- standing down without consuming this head's retry budget."
            exit 0
          fi

          # --match-head-commit: without it, a race between the pr-state fetch and this call
          # (a contributor pushes a new commit) would silently arm auto-merge on a
          # DIFFERENT, never-tested revision.
          if GH_TOKEN="$MERGE_TOKEN" gh pr merge "$PR" --repo "${REPO}" --auto --squash --match-head-commit "$HEAD_SHA"; then
            gh label create "${{ steps.check-retried.outputs.retry_label }}" --color d4c5f9 \
              --description "This revision already used its one automatic queue retry" \
              --repo "${REPO}" >/dev/null 2>&1 || true
            gh api -X POST "repos/${REPO}/issues/${PR}/labels" -f "labels[]=${{ steps.check-retried.outputs.retry_label }}" >/dev/null 2>&1 || true
            existing_labels=$(gh api --paginate "repos/${REPO}/issues/${PR}/labels" --jq '.[].name')
            if ! grep -qxF "${{ steps.check-retried.outputs.retry_label }}" <<< "$existing_labels"; then
              # Recheck the head before disarming: the --match-head-commit call above
              # already proved HEAD_SHA matched at that moment, but a new push can still
              # land in the gap between that success and reaching this disarm.
              current_head_sha=$(gh pr view "$PR" --repo "${REPO}" --json headRefOid --jq .headRefOid)
              if [ "$current_head_sha" != "$HEAD_SHA" ]; then
                echo "::notice::PR #$PR's head moved to ${current_head_sha:0:12} while verifying the retry-used label -- standing down without touching auto-merge on the replacement revision."
                exit 0
              fi
              echo "::error::Retry-used label failed to attach for PR #$PR (commit $HEAD_SHA12) -- disarming and handing off instead of risking an unbounded retry loop."
              gh pr merge "$PR" --repo "${REPO}" --disable-auto >/dev/null 2>&1 || true
              still_armed=$(gh pr view "$PR" --repo "${REPO}" --json autoMergeRequest --jq '.autoMergeRequest != null')
              in_queue=$(gh api graphql -f query='
                query($owner: String!, $name: String!, $pr: Int!) {
                  repository(owner: $owner, name: $name) { pullRequest(number: $pr) { id isInMergeQueue } }
                }' -f owner="${REPO%%/*}" -f name="${REPO##*/}" -F pr="$PR" 2>/dev/null)
              pr_node_id=$(echo "$in_queue" | jq -r '.data.repository.pullRequest.id')
              in_queue_val=$(echo "$in_queue" | jq -r '.data.repository.pullRequest.isInMergeQueue')
              if [ "$in_queue_val" = "true" ] && [ -n "$pr_node_id" ] && [ "$pr_node_id" != "null" ]; then
                gh api graphql -f query='mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' -f id="$pr_node_id" >/dev/null 2>&1 || true
                in_queue_val=$(gh api graphql -f query='
                  query($owner: String!, $name: String!, $pr: Int!) {
                    repository(owner: $owner, name: $name) { pullRequest(number: $pr) { isInMergeQueue } }
                  }' -f owner="${REPO%%/*}" -f name="${REPO##*/}" -F pr="$PR" 2>/dev/null | jq -r '.data.repository.pullRequest.isInMergeQueue')
              fi
              NO_MORE_RETRIES_MARKER="<!-- queue-retry-handler:no-more-retries sha=$HEAD_SHA12 -->"
              if [ "$still_armed" = "true" ] || [ "$in_queue_val" = "true" ]; then
                echo "::error::Auto-merge is STILL ARMED/QUEUED for PR #$PR despite the disable-auto/dequeue calls -- the one-retry bound cannot be relied on until this is fixed by hand."
                gh pr comment "$PR" --repo "${REPO}" --body "Merge-group CI failed for this revision (commit \`$HEAD_SHA12\`), and the retry-tracking label could not be recorded. Attempted to disarm/dequeue to prevent an unbounded retry loop, but could NOT confirm it succeeded -- this needs urgent human attention. $NO_MORE_RETRIES_MARKER" || true
                exit 1
              else
                gh pr comment "$PR" --repo "${REPO}" --body "Merge-group CI failed for this revision (commit \`$HEAD_SHA12\`), and the retry-tracking label could not be recorded. Disarmed rather than risk retrying unboundedly -- this needs a human: push a fix, or manually run \`gh pr merge --auto --squash\` once the labeling problem is resolved. $NO_MORE_RETRIES_MARKER" || true
              fi
            else
              gh pr comment "$PR" --repo "${REPO}" --body "Merge-group CI failed for this revision (commit \`$HEAD_SHA12\`) -- automatically re-armed auto-merge for one retry. If this fails again for the same commit, it will NOT retry again; it needs a human to look. [Run]($RUN_URL)" || true
            fi
          else
            echo "::error::Retry merge call failed for PR #$PR (commit $HEAD_SHA12) -- most likely superseded by a new push between pr-state's check and this call (--match-head-commit rejected the mismatch), a genuinely closed/merged PR, or a permission/token problem. Standing down without a human-handoff label -- if this was a real permission problem rather than a benign race, it will surface again on the next merge-group failure for this head."
          fi

      - name: Second failure on this head -- hand off to a human
        id: handoff
        if: steps.dedup.outputs.already_handled == 'false' && steps.check-retried.outputs.already_retried == 'true'
        run: |
          current_head_sha=$(gh pr view "$PR" --repo "${REPO}" --json headRefOid --jq .headRefOid)
          if [ "$current_head_sha" != "$HEAD_SHA" ]; then
            echo "::notice::PR #$PR's head moved since this job started (now ${current_head_sha:0:12}) -- this attempt is moot; standing down."
            exit 0
          fi

          # Recorded before the create/POST below: if queue-needs-human-review was already
          # attached by another source (a maintainer's manual label), this handoff isn't the
          # true provenance owner and must not post its own SHA marker, or the staleness
          # classifier in auto-merge-trigger.yml would misattribute someone else's still-
          # valid pause to this event and auto-clear it on the next push.
          labels_before=$(gh api --paginate "repos/${REPO}/issues/${PR}/labels" --jq '.[].name')
          already_present=$(grep -qxF "queue-needs-human-review" <<< "$labels_before" && echo true || echo false)

          gh label create queue-needs-human-review --color b60205 \
            --description "Needs a human decision -- an automated handler could not safely proceed" \
            --repo "${REPO}" >/dev/null 2>&1 || true
          gh api --method POST "repos/${REPO}/issues/${PR}/labels" -f "labels[]=queue-needs-human-review" >/dev/null 2>&1 || true
          existing_labels=$(gh api --paginate "repos/${REPO}/issues/${PR}/labels" --jq '.[].name')
          if ! grep -qxF "queue-needs-human-review" <<< "$existing_labels"; then
            echo "::error::Could not attach queue-needs-human-review to PR #$PR (commit $HEAD_SHA12) -- failing this step so the attempt isn't marked handled."
            exit 1
          fi

          # Disarm/dequeue any concurrently re-armed auto-merge: a trusted `edited` run of
          # auto-merge-trigger.yml can complete AFTER pr-state read auto-merge as disarmed
          # but BEFORE this step attached the pause label above -- that concurrent run's own
          # live-label check still read the label as absent at the time it ran and
          # legitimately re-armed the SAME unchanged revision. The label guards FUTURE
          # workflow runs but doesn't retroactively cancel an arm already in flight.
          still_armed=$(gh pr view "$PR" --repo "${REPO}" --json autoMergeRequest --jq '.autoMergeRequest != null')
          in_queue_state=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) { pullRequest(number: $pr) { id isInMergeQueue } }
            }' -f owner="${REPO%%/*}" -f name="${REPO##*/}" -F pr="$PR" 2>/dev/null)
          pr_node_id=$(echo "$in_queue_state" | jq -r '.data.repository.pullRequest.id')
          in_queue=$(echo "$in_queue_state" | jq -r '.data.repository.pullRequest.isInMergeQueue')
          if [ "$still_armed" = "true" ] || [ "$in_queue" = "true" ]; then
            echo "::notice::Auto-merge was concurrently re-armed/queued for PR #$PR (commit $HEAD_SHA12) between pr-state's check and this handoff -- disarming/dequeuing it now."
            gh pr merge "$PR" --repo "${REPO}" --disable-auto >/dev/null 2>&1 || true
            if [ "$in_queue" = "true" ] && [ -n "$pr_node_id" ] && [ "$pr_node_id" != "null" ]; then
              gh api graphql -f query='mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' -f id="$pr_node_id" >/dev/null 2>&1 || true
            fi
            still_armed_after=$(gh pr view "$PR" --repo "${REPO}" --json autoMergeRequest --jq '.autoMergeRequest != null')
            in_queue_after=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $pr: Int!) {
                repository(owner: $owner, name: $name) { pullRequest(number: $pr) { isInMergeQueue } }
              }' -f owner="${REPO%%/*}" -f name="${REPO##*/}" -F pr="$PR" 2>/dev/null | jq -r '.data.repository.pullRequest.isInMergeQueue')
            if [ "$still_armed_after" = "true" ] || [ "$in_queue_after" = "true" ]; then
              echo "::error::Auto-merge is STILL ARMED/QUEUED for PR #$PR (commit $HEAD_SHA12) despite the disable-auto/dequeue calls -- this handoff's 'no more retries' guarantee cannot be relied on until this is fixed by hand. Failing this step so the attempt isn't marked handled."
              exit 1
            fi
          fi

          if [ "$already_present" = "true" ]; then
            gh pr comment "$PR" --repo "${REPO}" --body "Merge-group CI failed again for commit \`$HEAD_SHA12\` after its one automatic retry ([run]($RUN_URL)). queue-needs-human-review was already attached before this handoff ran (from another source) -- not claiming provenance over it; the existing pause stands as-is." || true
          else
            gh pr comment "$PR" --repo "${REPO}" --body "Merge-group CI failed again for commit \`$HEAD_SHA12\` after its one automatic retry ([run]($RUN_URL)). Not retrying again -- this needs a human decision: push a fix, or investigate and manually re-run \`gh pr merge --auto --squash\` if it's a known flake.
            <!-- queue-retry-handler:queue-needs-human-review sha=$HEAD_SHA12 -->" || true
          fi

      - name: Mark this merge-group attempt as handled
        if: |
          always() &&
          needs.check-pr-state.outputs.stale == 'false' &&
          steps.dedup.outputs.already_handled == 'false' &&
          (steps.retry.conclusion == 'success' || steps.handoff.conclusion == 'success')
        run: |
          if ! gh label create "${{ steps.dedup.outputs.attempt_label }}" --color 8a8a8a \
              --description "This merge-group attempt has already been retried or handed off" \
              --repo "${REPO}" >/dev/null 2>&1; then
            echo "::warning::Could not create the attempt-handled label -- a redelivered event for this same attempt may be processed twice, which is safe (idempotent, dedup checks re-verify live state) but not silent."
          fi
          gh api -X POST "repos/${REPO}/issues/${PR}/labels" -f "labels[]=${{ steps.dedup.outputs.attempt_label }}" >/dev/null 2>&1 || true
