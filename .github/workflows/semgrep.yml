name: Semgrep

on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  # fleet-ci phase 0 (2026-09-14): dropped schedule only (GitHub throttles crons to ~6-9/day
  # regardless of spec, so the daily cron bought nothing beyond what pull_request/push already
  # cover). pull_request is retained even though merge_group now also runs Semgrep on every
  # merge-group entry (this repo cut over from Mergify's own queue to GitHub's native
  # merge_group as of 2026-09-15, PR #381/#384/#385) -- dropping pull_request would leave a
  # PR with zero Semgrep coverage for however long it sits open before entering the queue,
  # not just until a post-merge push (caught in Codex review, PR #382, back when merge_group
  # genuinely never fired here).

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      image: semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # GitHub withholds repo Actions secrets from a fork-triggered pull_request and (unless
      # separately provisioned as a Dependabot secret) from Dependabot-authored runs -- either
      # case leaves SEMGREP_APP_TOKEN empty here, and semgrep ci has no local --config fallback,
      # so it would otherwise fail every fork PR's and every dependency-bump PR's check outright
      # (Codex round, cqdx #360/panino #109/widdershins #234/pancetta #297/coppa #87). Skip
      # gracefully instead of either excluding those authors up front (which silently drops the
      # exact PRs -- especially Dependabot's -- this scanner most needs to cover) or letting the
      # run fail hard. Once SEMGREP_APP_TOKEN is added as a Dependabot secret (not yet done --
      # CAT-307 follow-up), Dependabot PRs start getting scanned automatically with no further
      # change here.
      - name: Run semgrep ci
        run: |
          if [ -z "$SEMGREP_APP_TOKEN" ]; then
            echo "SEMGREP_APP_TOKEN not available (fork PR, or Dependabot secret not yet provisioned) -- skipping this run."
            exit 0
          fi
          semgrep ci
