name: Release

# Builds prebuilt binaries on every v* tag push and attaches them to a DRAFT
# GitHub Release. The operator publishes the draft — tags and releases are
# operator-gated (docs/superpowers/plans/2026-07-13-onboarding-phase3-releases.md).
#
# Engineering notes (mirrors ci.yml house policy):
#   - ft8_lib submodule: checkout MUST be `submodules: recursive`, and a hard
#     guard + a run-the-binary smoke step verify the real C decoder is baked
#     in. Without the submodule, pancetta-ft8/build.rs silently falls back to
#     ft8lib_stub (degraded decode recall) — a stub binary must NEVER ship.
#   - pancetta-research is a local-only iteration harness (CLAUDE.md): never
#     built in CI. This workflow builds `-p pancetta` only, so it is excluded
#     structurally — do not change this to a --workspace build.
#   - Windows uses the GNU (MinGW) toolchain, never MSVC: MSVC cannot compile
#     the VLAs in vendor/ft8_lib/ft8/decode.c (error C2057; see the
#     cross-platform-check note in ci.yml, 2026-05-23). The on-rig Windows
#     MiniPC builds with MinGW already, so gnu is also the proven toolchain.
#   - crates.io publishing is OUT of scope ([workspace.package] publish=false).
#     This workflow ships binaries only.

on:
  push:
    tags: ['v*']
  # Dry run: builds + smoke-tests artifacts (named after the branch), but the
  # release job is tag-gated and will not run.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            # 22.04, not 24.04: the oldest glibc baseline GitHub's hosted
            # arm64 runners offer (glibc 2.35 vs. 24.04's 2.39). A binary
            # linked against 24.04's newer glibc symbol versions can fail in
            # the dynamic loader on an older Pi OS image before it ever runs
            # (PR #278 review). This doesn't cover Bullseye-era Pi OS (glibc
            # 2.31) — no GitHub-hosted arm64 runner goes that old — hence the
            # "unvalidated on real hardware" caveat in README.md staying in
            # place rather than being removed by this change.
            os: ubuntu-22.04-arm
          - target: x86_64-pc-windows-gnu
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # REQUIRED: without the ft8_lib submodule the binary ships the
          # degraded ft8lib_stub decoder. Two more gates below back this up.
          submodules: recursive

      - name: Guard — ft8_lib submodule sources present
        shell: bash
        # Exact file pancetta-ft8/build.rs keys the stub fallback on.
        run: |
          test -f pancetta-ft8/vendor/ft8_lib/ft8/constants.c \
            || { echo "::error::ft8_lib submodule not checked out — refusing to build a stub release"; exit 1; }

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libssl-dev pkg-config

      - name: Assert MinGW gcc available (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # windows-latest images ship MinGW gcc on PATH; the cc crate uses it to
        # compile ft8_lib for the gnu target. If a future image drops it, add:
        #   choco install mingw -y
        run: gcc --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        # -p pancetta only: excludes pancetta-research (local-only, never in
        # CI) and every helper binary. Default features (metrics + hamlib
        # rigctld-TCP client) are the production build; no system hamlib is
        # needed at build time (runtime-only, via rigctld over TCP).
        #
        # CLUBLOG_API_KEY: ClubLog issues its API key per-application, not
        # per-operator, so official release binaries bake in Pancetta's own
        # key (pancetta-config/src/network.rs, `option_env!`) — operators
        # then only need their own ClubLog email/password, not a personal
        # key. pancetta-config/build.rs pins a rebuild to this var so
        # rust-cache below can't silently serve a build compiled before the
        # secret existed. Empty/unset (e.g. a fork without the repo secret)
        # degrades to no default key — ClubLog upload still works if the
        # operator sets their own `network.clublog.api_key`.
        env:
          CLUBLOG_API_KEY: ${{ secrets.CLUBLOG_API_KEY }}
        run: cargo build --release -p pancetta --target ${{ matrix.target }}

      - name: Smoke test — binary must embed the real C decoder
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/pancetta"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="$BIN.exe"; fi
          "$BIN" info
          "$BIN" info | grep -q "ft8_lib C decoder: native-C" \
            || { echo "::error::binary was built with ft8lib_stub — degraded decoder must not ship"; exit 1; }

      - name: Decode fixture verification (ARM only) — proves decoding, not just linkage
        # The smoke test above only proves the native C decoder is linked in;
        # it never decodes anything, so it can't catch an ARM-specific
        # decoder/FFI/DSP regression (PR #278 review). This runs the same
        # off-air-fixture cross-validation ci.yml's "FT8 Tests" job runs on
        # x86_64, natively on the arm64 runner (not cross-compiled), and
        # asserts our decoder finds >=100% of what the real ft8_lib decoder
        # finds across 9 real recordings. Scoped to one non-timing-sensitive
        # test (not the full pancetta-ft8 suite, which includes real-time
        # budget assertions unproven on this runner class) to keep the
        # release gate itself robust.
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo test -p pancetta-ft8 --test wav_decode_tests test_cross_validate_against_ft8lib -- --exact

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # Sanitize: GITHUB_REF_NAME is a bare tag ("v0.9.5") on a real
          # release, but on a workflow_dispatch dry run it's the branch name,
          # which contains "/" per this repo's feat/fix/docs/... convention
          # and would otherwise break `mkdir` by being read as a path.
          REF_SLUG="${GITHUB_REF_NAME//\//-}"
          NAME="pancetta-${REF_SLUG}-${{ matrix.target }}"
          mkdir "$NAME"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/pancetta.exe" "$NAME/"
          else
            cp "target/${{ matrix.target }}/release/pancetta" "$NAME/"
          fi
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md "$NAME/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${NAME}.zip" "$NAME"
            ARCHIVE="${NAME}.zip"
          else
            tar czf "${NAME}.tar.gz" "$NAME"
            ARCHIVE="${NAME}.tar.gz"
          fi
          # sha256sum on Linux + Git-Bash/Windows; shasum on macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            pancetta-*.tar.gz*
            pancetta-*.zip*
          if-no-files-found: error

  release:
    name: Create draft release
    # Tag pushes only — workflow_dispatch dry runs stop after build+smoke.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7   # CHANGELOG.md only; no submodule needed

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" \
            'index($0, "## [" ver "]") == 1 {flag=1; next} /^## /{flag=0} flag' \
            CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for ${VERSION}"; exit 1; }
          {
            echo ""
            echo "---"
            echo "Tagged at \`${GITHUB_SHA}\`. Prebuilt binaries: macOS (Apple Silicon),"
            echo "Linux x86_64 (gnu), Linux aarch64/Raspberry Pi (gnu — needs glibc >= 2.35,"
            echo "i.e. Raspberry Pi OS Bookworm/2023-10 or newer; Bullseye-era images can't"
            echo "load it), Windows x86_64 (MinGW). Every binary is CI-verified to embed the"
            echo "real \`ft8_lib\` C decoder (\`pancetta info\`); the Linux aarch64 build is"
            echo "additionally verified against a real off-air decode fixture, not just"
            echo "linkage."
          } >> notes.md

      - name: Create draft release (operator publishes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --verify-tag \
            --title "Pancetta $GITHUB_REF_NAME" \
            --notes-file notes.md
