name: Regenerate demo assets

# Re-renders .tapes/demo.tape whenever a PR touches the TUI, the tape
# sources, or the replay WAV fixtures it feeds, and auto-commits the
# resulting assets/demo.gif if the render changed. Keeps the README hero
# GIF from silently going stale.
#
# Mirrors this repo's other CI lanes (see ci.yml/docs.yml/release.yml):
# checkout MUST be `submodules: recursive` and the Linux runner needs the
# same system packages (libasound2-dev/libudev-dev/libssl-dev/pkg-config)
# to link cpal/audio + reqwest/TLS deps, or `cargo build -p pancetta` fails
# outright on ubuntu-latest.
#
# Note: this workflow's job is only to re-render whatever the tape currently
# produces and commit it if the bytes changed -- it makes no claim about
# decode content. `.tapes/demo.tape` documents the corpus's decode profile
# (only the last file decodes, ~26 messages) in its trailing comment block.

on:
  pull_request:
    paths:
      - "pancetta-tui/**"
      - ".tapes/**"
      - "assets/demo-wav/**"
      # The GIF's content depends on far more than the TUI crate: the binary
      # crate owns the replay feeder and its pacing/grace-period timing
      # (pancetta/src/coordinator/replay.rs), the audio and DSP stages, and
      # the CLI gates the tape drives. pancetta-config and pancetta-ft8 own
      # the decode-effort presets and the decoder itself, both of which the
      # tape renders on screen. Without these paths a change to the replay
      # feeder would never retrigger regeneration and the GIF would go stale
      # silently -- which is the exact failure this workflow exists to stop.
      - "pancetta/src/**"
      - "pancetta-config/src/**"
      - "pancetta-ft8/src/**"

permissions:
  contents: write

jobs:
  vhs:
    runs-on: ubuntu-latest
    # Fork PRs cannot run this job: the `ref: ${{ github.head_ref }}` checkout
    # below names a branch that does not exist in the base repo, so checkout
    # hard-fails (not skips) on every external contribution. The auto-commit
    # push would fail anyway -- a `pull_request` event from a fork gets a
    # read-only token regardless of the `contents: write` permission above.
    # Skipping cleanly beats failing loudly on someone else's PR; a maintainer
    # can re-render by hand per .tapes/README.md.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          # Without the ft8_lib submodule, pancetta-ft8/build.rs silently
          # falls back to the stub decoder (see release.yml's guard). That
          # wouldn't break this workflow, but a demo build should still
          # match how the binary is actually built everywhere else in CI.
          submodules: recursive
          # REQUIRED for pull_request events: without this, checkout leaves
          # a detached HEAD at the merge ref, and
          # stefanzweifel/git-auto-commit-action's push falls through to a
          # bare `git push origin` with no refspec, which fails outright
          # ("not currently on a branch"). Checking out the PR's actual
          # head branch is what its own docs prescribe for this trigger.
          ref: ${{ github.head_ref }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: demo-assets

      - name: Build pancetta
        # Pre-build so the tape's `cargo run --release -p pancetta` starts
        # the TUI almost immediately -- the tape's Wait+Screen@15s anchor
        # assumes a warm binary, not a fresh compile.
        run: cargo build --release -p pancetta

      - name: Render demo tape
        uses: charmbracelet/vhs-action@v2
        with:
          path: ".tapes/demo.tape"

      - name: Check for changed assets
        id: diff
        run: |
          if ! git diff --quiet -- assets/demo.gif; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated GIF
        if: steps.diff.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # Deliberately NO `[skip ci]` here. The GIF is not byte-reproducible
          # (embedded timestamps, live waterfall), so this step fires on
          # nearly every qualifying PR. With `[skip ci]` GitHub skips ALL
          # workflows for the pushed commit, leaving the PR's newest commit
          # with no CI runs at all -- required checks stay pending forever, or
          # the PR merges against a head that was never actually checked. One
          # extra CI run per regeneration is the correct price for that.
          #
          # KNOWN LIMITATION (not fixable in this workflow file, tracked here
          # so it is not silently forgotten): dropping `[skip ci]` is
          # necessary but NOT sufficient. GitHub deliberately does not trigger
          # any workflow run for a commit pushed with the default
          # `GITHUB_TOKEN`, precisely to prevent recursive workflow loops --
          # so the auto-commit above still lands a head commit with no CI
          # attached regardless of the commit message. Actually closing the
          # gap needs one of:
          #   1. push with a PAT or GitHub App installation token instead of
          #      GITHUB_TOKEN (a repo-secrets/infrastructure change), or
          #   2. redesign this lane as verify-only -- render, `git diff
          #      --exit-code assets/demo.gif`, and FAIL the check telling the
          #      author to re-render locally, committing nothing.
          # Both are out of scope for a code-only change.
          commit_message: "chore: regenerate demo.gif"
          file_pattern: assets/demo.gif
          # Belt-and-suspenders alongside the checkout `ref:` above: pins
          # the push target explicitly to the PR's head branch.
          branch: ${{ github.head_ref }}
