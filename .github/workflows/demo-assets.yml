name: Regenerate demo assets

# Re-renders `.tapes/demo.tape` **on request** and auto-commits the resulting
# assets/demo.gif if the render changed. Keeps the README hero GIF from
# silently going stale without regenerating it on every push.
#
# Manual trigger only -- from the Actions tab ("Run workflow", picking the
# branch in the ref dropdown) or from the CLI:
#
#   gh workflow run demo-assets.yml --ref <branch>
#
# This lane used to run automatically on `pull_request` with the path filter
# preserved below. That fired far more often than anyone wanted: the render is
# never byte-reproducible (embedded timestamps, live waterfall), so it
# auto-committed on nearly every run -- 8 regenerations in ~3 hours during one
# PR's review-fix cycle, each one a new head commit. Automating this again is
# still worth doing (a schedule, or the verify-only shape sketched in the
# auto-commit step below), but not per-push.
#
# WHEN TO DISPATCH IT: after a change under any of these paths, which is the
# exact `paths:` filter the `pull_request` trigger carried and the one to
# restore under whatever automatic trigger eventually replaces this:
#
#   - "pancetta-tui/**"
#   - ".tapes/**"
#   - "assets/demo-wav/**"
#   # The GIF's content depends on far more than the TUI crate: the binary
#   # crate owns the replay feeder and its pacing/grace-period timing
#   # (pancetta/src/coordinator/replay.rs), the audio and DSP stages, and the
#   # CLI gates the tape drives. pancetta-config and pancetta-ft8 own the
#   # decode-effort presets and the decoder itself, both of which the tape
#   # renders on screen. Without these paths a change to the replay feeder
#   # would never call for regeneration and the GIF would go stale silently --
#   # which is the exact failure this workflow exists to stop.
#   - "pancetta/src/**"
#   - "pancetta-config/src/**"
#   - "pancetta-ft8/src/**"
#
# Mirrors this repo's other CI lanes (see ci.yml/docs.yml/release.yml):
# checkout MUST be `submodules: recursive` and the Linux runner needs the
# same system packages (libasound2-dev/libudev-dev/libssl-dev/pkg-config)
# to link cpal/audio + reqwest/TLS deps, or `cargo build -p pancetta` fails
# outright on ubuntu-latest.
#
# Note: this workflow's job is only to re-render whatever the tape currently
# produces and commit it if the bytes changed -- it makes no claim about
# decode content. `.tapes/demo.tape` documents the corpus's decode profile
# (only the last file decodes, ~26 messages) in its trailing comment block.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vhs:
    runs-on: ubuntu-latest
    # No fork guard needed under `workflow_dispatch`: dispatching a workflow
    # requires write access to THIS repository, and the run always operates on
    # a ref of this repository -- there is no fork head to check. (The previous
    # `github.event.pull_request.head.repo.full_name == github.repository`
    # guard would in fact skip every run now, since a dispatch carries no
    # pull_request event payload at all.)
    steps:
      - uses: actions/checkout@v7
        with:
          # Without the ft8_lib submodule, pancetta-ft8/build.rs silently
          # falls back to the stub decoder (see release.yml's guard). That
          # wouldn't break this workflow, but a demo build should still
          # match how the binary is actually built everywhere else in CI.
          submodules: recursive
          # No explicit `ref:` -- a `workflow_dispatch` run already resolves
          # `github.ref` to the branch chosen at dispatch time, and checkout
          # leaves that branch checked out (not a detached merge ref, which is
          # what `pull_request` gave us and what forced an explicit `ref:`
          # here before). The auto-commit push below therefore has a branch to
          # push to. Dispatch against a BRANCH, not a tag.

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: demo-assets

      - name: Build pancetta
        # Pre-build so the tape's `cargo run --release -p pancetta` starts
        # the TUI almost immediately -- the tape's Wait+Screen@15s anchor
        # assumes a warm binary, not a fresh compile.
        run: cargo build --release -p pancetta

      - name: Render demo tape
        uses: charmbracelet/vhs-action@v2
        with:
          path: ".tapes/demo.tape"

      - name: Check for changed assets
        id: diff
        run: |
          if ! git diff --quiet -- assets/demo.gif; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated GIF
        if: steps.diff.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          # Deliberately NO `[skip ci]` here. The GIF is not byte-reproducible
          # (embedded timestamps, live waterfall), so this step fires on
          # essentially every dispatch. With `[skip ci]` GitHub skips ALL
          # workflows for the pushed commit, leaving the branch's newest commit
          # with no CI runs at all -- required checks stay pending forever, or
          # a PR merges against a head that was never actually checked. One
          # extra CI run per regeneration is the correct price for that.
          #
          # KNOWN LIMITATION (not fixable in this workflow file, tracked here
          # so it is not silently forgotten): dropping `[skip ci]` is
          # necessary but NOT sufficient. GitHub deliberately does not trigger
          # any workflow run for a commit pushed with the default
          # `GITHUB_TOKEN`, precisely to prevent recursive workflow loops --
          # so the auto-commit above still lands a head commit with no CI
          # attached regardless of the commit message. Actually closing the
          # gap needs one of:
          #   1. push with a PAT or GitHub App installation token instead of
          #      GITHUB_TOKEN (a repo-secrets/infrastructure change), or
          #   2. redesign this lane as verify-only -- render, `git diff
          #      --exit-code assets/demo.gif`, and FAIL the check telling the
          #      author to re-render locally, committing nothing.
          # Both are out of scope for a code-only change.
          commit_message: "chore: regenerate demo.gif"
          file_pattern: assets/demo.gif
          # Belt-and-suspenders alongside the checkout above: pins the push
          # target explicitly to the dispatched branch. (`github.ref_name` is
          # the dispatch ref's short name -- `head_ref` is empty outside a
          # `pull_request` event and would push nowhere.)
          branch: ${{ github.ref_name }}
