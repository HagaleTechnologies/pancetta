              # continuation; the block ENDS at the first empty line, ordinary comment,
              # UNKNOWN directive (treated as a comment) or instruction -- a later
              # `# syntax=` is then an inert comment. A directive given twice is invalid;
              # refused rather than guessed (Codex local round, sync PRs).
              for raw in text.splitlines():
                  m = re.match(r"\s*#\s*([A-Za-z]+)\s*=\s*(\S+)\s*$", raw)
                  if not m or m.group(1).lower() not in ("syntax", "escape", "check"): break
                  key, val = m.group(1).lower(), m.group(2)
                  if key in seen:
                      if hard_fail is not None: hard_fail.add(f"{label}: parser directive `{key}` appears twice -- invalid Dockerfile, refused")
                      break
                  seen.add(key)
                  if key == "escape": esc = val[0]
                  elif key == "syntax": out.append("container:" + val)              # BuildKit frontend image: pulled and executed first
              logical, buf = [], ""
              for raw in text.splitlines():
                  if raw.lstrip().startswith("#"): continue
                  if raw.rstrip().endswith(esc):
                      buf += raw.rstrip()[:-1] + " "; continue
                  logical.append(buf + raw); buf = ""
              if buf: logical.append(buf)
              # Docker heredocs (`RUN <<EOF ... EOF`, `COPY <<X ...`) are NOT parsed by this
              # gate: getting shell heredoc grammar exactly right (quoting, grouped
              # operators, escapes, dash delimiters) is a bypass surface in itself, and a
              # body line can forge a stage alias. Any unquoted `<<` token in a RUN/COPY/ADD
              # instruction therefore fails closed with an explicit message. ACCEPTED
              # OVER-APPROXIMATION (policy, not a bug): this also refuses rare non-heredoc
              # uses such as `$((1 << 2))` or an escaped `\<<`: the instruction must be
              # rewritten without a `<<` operator (e.g. multiply instead of shift, or
              # move the script into a file ADDed from the context). The fleet has no
              # Dockerfile-backed action today, so the cost is zero and the bypass
              # surface is closed.
              for line in logical:                                   # HEAD: refuse heredocs; BASE: a heredoc-bearing base is

                  m = re.match(r"\s*(?:ONBUILD\s+)?(?:RUN|COPY|ADD)\s+((?:--\S+\s+)*)(.*)$", line, re.I | re.S)
                  if m:
                      if m.group(2).lstrip().startswith("["):
                          try:
                              if isinstance(json.loads(m.group(2).strip()), list): continue   # JSON (exec) form: no shell, no heredoc
                          except ValueError:
                              pass                                                          # `RUN [ -e x ] || …` is shell form
                      try:
                          lex = shlex.shlex(line, posix=False, punctuation_chars=True); lex.whitespace_split = True; lex.commenters = ""; toks = list(lex)
                      except ValueError:
                          toks = line.split()
                      if any("<<" in t and "<<<" not in t and not t.startswith(("'", '"')) for t in toks):   # `<<<` is a here-string, not a heredoc
                          # an UNCONDITIONAL failure at HEAD (never a subtractable reference):
                          # a heredoc that already existed at the base must still fail the PR
                          if hard_fail is not None:
                              hard_fail.add(f"{label}: a RUN/COPY/ADD instruction uses a heredoc (`<<`) -- this gate refuses to parse heredocs; rewrite the instruction without one")
                          # UNAVAILABLE for subtraction (fail closed): body text could otherwise
                          # cancel a genuinely new reference, and such a base can only predate
                          # this gate -- a cleanup PR must pin everything it keeps.
                          return []
              global_args, stage_args, stages, index = {}, {}, set(), 0
              in_stage = False
              def expand(v, scope):
                  v = re.sub(r"\$\{([A-Za-z_][A-Za-z0-9_]*)(?::-([^}]*))?\}",
                             lambda m: (scope.get(m.group(1)) or (m.group(2) if m.group(2) is not None else scope.get(m.group(1), m.group(0)))) if m.group(2) is not None or m.group(1) in scope else m.group(0), v)
                  return re.sub(r"\$([A-Za-z_][A-Za-z0-9_]*)", lambda m: scope.get(m.group(1), m.group(0)), v)
              for line in logical:
                  m = re.match(r"\s*ARG\s+([A-Za-z_][A-Za-z0-9_]*)(?:=(.*))?\s*$", line, re.I)
                  if m:
                      name, val = m.group(1), m.group(2)
                      val = None if val is None else val.strip().strip("\"'")
                      if not in_stage:
                          global_args[name] = val or ""                              # pre-FROM: global default
                      elif val is not None:
                          stage_args[name] = val                                     # stage-local value
                      else:
                          stage_args[name] = global_args.get(name, "")               # valueless: inherits the GLOBAL default only
                      continue
                  # COPY/ADD --from=X (instruction FLAGS only) and RUN --mount=...,from=X
                  # (inside the --mount option value only) pull X when it is not a stage;
                  # ordinary command text such as `RUN echo from=x` is never an image.
                  srcs = []
                  am = re.match(r"\s*(?:ONBUILD\s+)?ADD\s+((?:--\S+\s+)*)(.*)$", line, re.I | re.S)
                  if am:
                      flags, rest = am.group(1), am.group(2).strip()
                      try: parts = json.loads(rest) if rest.startswith("[") else shlex.split(rest, posix=True)
                      except ValueError: parts = rest.split()
                      for src in parts[:-1]:                                             # last word is the destination
                          src = str(src)
                          # NOT expanded: inside a stage, ENV overrides a same-named ARG (Docker
                          # reference), and a base image's own ENV is invisible here, so an ARG
                          # value is never proof of what Docker will use. A variable in an ADD
                          # source fails closed; write it literally (Codex panino round 8).
                          if "$" in src:
                              if hard_fail is not None: hard_fail.add(f"{label}: ADD source `{src}` uses a variable -- ENV can override any ARG (including from the base image), so the gate cannot know what is fetched; write the source literally")
                              continue
                          # a bare local path/dirname ending in ".git" (e.g. a fixture named
                          # "repo.git") is NOT a remote source -- Docker's own docs show git
                          # sources ONLY via an explicit transport (git@host:, ssh://, git://)
                          # or an http(s):// URL; there is no documented bare-hostname
                          # shorthand for ADD, so `.endswith(".git")` alone over-matched local
                          # paths (Codex round 1, pancetta #291).
                          if re.match(r"(?i)^(https?://|git@[\w.-]+:|ssh://|git://)", src):
                              # remote content baked into the action image: a URL needs an
                              # immutable --checksum=sha256:…, a git source is never pinned enough
                              if re.match(r"(?i)^https://", src) and re.search(r"--checksum=sha256:[0-9a-f]{64}", flags): continue   # plaintext http is never acceptable
                              out.append("container:ADD-REMOTE-UNPINNED(" + src + ")")
                  fm = re.match(r"\s*(?:ONBUILD\s+)?(COPY|ADD)\s+((?:--\S+\s+)*)", line, re.I)
                  if fm: srcs += [v.strip("'\"") for v in re.findall(r"--from=(\S+)", fm.group(2))]   # Docker removes quotes: --from="build"
                  rm = re.match(r"\s*(?:ONBUILD\s+)?RUN\s+((?:--\S+\s+)*)", line, re.I)
                  if rm:
                      for mnt in re.findall(r"--mount=(\S+)", rm.group(1)):
                          mnt = mnt.strip("'\"")                         # --mount="from=img,target=/x" is valid BuildKit syntax
                          srcs += [v.strip("'\"") for v in re.findall(r"(?:^|,)from=([^,]+)", mnt)]
                  for src in srcs:
                      if "$" in src:                                                 # same ENV-over-ARG argument: a variable stage/image ref is refused
                          if hard_fail is not None: hard_fail.add(f"{label}: `{line.strip()[:60]}` references image/stage `{src}` through a variable -- ENV can override any ARG, so the gate cannot know what is pulled; write it literally")
                          continue
                      onbuild = bool(re.match(r"\s*ONBUILD\b", line, re.I))   # a deferred trigger runs DOWNSTREAM: a stage name is an external image there
                      if onbuild or (src.lower() not in stages and not (src.isdigit() and int(src) < index)):
                          out.append("container:" + src)
                  m = re.match(r"\s*FROM\s+((?:--\S+\s+)*)(\S+)(?:\s+AS\s+(\S+))?", line, re.I)
                  if not m: continue
                  img, alias = expand(m.group(2), global_args), m.group(3)            # FROM sees only global ARGs
                  in_stage, stage_args = True, {}                                    # a new stage starts with an empty ARG scope
                  is_stage_index = img.isdigit() and int(img) < index
                  if img.lower() != "scratch" and img.lower() not in stages and not is_stage_index:
                      out.append("container:" + img)
                  if alias: stages.add(alias.lower())
                  index += 1
              return out
          def manifests_at(rev):
              _, out = sh("git", "ls-tree", "-r", "--name-only", "-z", rev)
              return [p for p in out.split("\0") if os.path.basename(p) in ("action.yml", "action.yaml")]
          def image_files_at(rev):
