              path, any filename) -- a change to such a file changes what executes."""
              refs = set()
              for m in manifests_at(rev):
                  doc = load(rev, m)
                  runs = doc.get("runs") if isinstance(doc, dict) else None
                  img = runs.get("image") if isinstance(runs, dict) else None
                  if isinstance(img, str) and img.strip() and not img.startswith("docker://"):
                      refs.add(os.path.normpath(os.path.join(os.path.dirname(m), img.strip())))
              return refs
          REF_CACHE = {}
          def referenced_at(rev):
              if rev not in REF_CACHE: REF_CACHE[rev] = image_files_at(rev)
              return REF_CACHE[rev]
          REFERENCED = None
          def is_target(p):
              global REFERENCED
              if REFERENCED is None: REFERENCED = referenced_at(head) | referenced_at(base)   # union: classify the CHANGE
              b = os.path.basename(p); bl = b.lower()
              return ((p.startswith(".github/workflows/") and p.endswith((".yml", ".yaml"))) or b in ("action.yml", "action.yaml")
                      or bl.startswith("dockerfile") or bl.endswith(".dockerfile") or p in REFERENCED)
