          # Newly-added-action pin policy (CAT-299 / ADR-0014). Structural, not textual:
          # every workflow (.github/workflows/*.yml) and every action manifest
          # (**/action.yml|yaml) changed in the PR is parsed at the PR's MERGE-BASE and at
          # HEAD; the executable references of each file -- step `uses`, job-level
          # reusable-workflow `uses`, job `container`/`services.*.image`, composite/docker
          # action `runs.image` (a Dockerfile-backed action's FROM images; any changed
          # Dockerfile, or any file an action manifest names as its runs.image, whatever its
          # filename; COPY/ADD/RUN --from images too), with local `./path` actions expanded
          # recursively -- are
          # counted PER FILE, and only occurrences new in that file are judged: floating
          # branch ref or no version -> fail; docker:// or container image without an
          # immutable @sha256 digest -> fail; tag pin -> warning; SHA -> ok. Local
          # references are expanded per invocation (cycle-safe, fail-closed on depth) and
          # a file renamed INTO an executable location is judged as new.
          # HagaleTechnologies/ refs are the fleet's own code.
          base_arg, head = sys.argv[1], sys.argv[2]
          def sh(*a):
              r = subprocess.run(a, capture_output=True, text=True); return r.returncode, r.stdout
          rc, mb = sh("git", "merge-base", base_arg, head)
          base = mb.strip() if rc == 0 and mb.strip() else base_arg   # judge only the PR's own additions
          def dockerfile_images(text, hard_fail=None, label="Dockerfile"):
              """container:<image> for every FROM that is not `scratch`, an earlier build
              stage (alias OR numeric index), honouring a leading `# escape=` directive for
              line continuations; heredoc-bearing instructions fail closed; `ARG NAME=default` declared before a FROM is substituted
              ($NAME / ${NAME} / ${NAME:-fallback}); an unresolved variable stays in the
              ref and fails the digest check (fail closed)."""
