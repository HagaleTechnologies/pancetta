          n=0
          while IFS= read -r lock; do
            n=$((n+1)); echo "== $lock"; ( cd "$(dirname "$lock")" && python3 /tmp/cargo-sources.py && cargo fetch --locked )
          done < <(find . \( -name node_modules -o -name target -o -name .git \) -prune -o -name 'Cargo.lock' -print | sort)
          echo "checked $n Cargo lockfile(s)"
  # Runs on EVERY PR (~10s): no path filter can know the custom filenames a
  # Docker action's runs.image may point at, so the script classifies every
  # changed file itself (local review gate, round 3).
  actions-pins:
    name: Newly added actions are pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
