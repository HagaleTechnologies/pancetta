name: Supply Chain

# (CAT-299) Supply-chain gate for dependency changes. Governance: dispensa ADR-0014.
#
# WHY THIS RUNS ON EVERY PR: the job named "Supply Chain" below is a
# ruleset-required status check on main. A required check that only ran on
# some PRs would leave every other PR stuck at "Expected -- waiting for
# status" forever, so this workflow runs on every PR and passes trivially
# when no dependency manifest, lockfile, or workflow changed. When one DID
# change, the scanners run and GitHub's native auto-merge (armed by
# auto-merge.yml / dependabot-auto-merge.yml via `gh pr merge --auto`)
# cannot fire until they pass -- that is the "dependency bumps are excluded
# from blanket standing auto-merge until a scan passes" carve-out, enforced
# by the ruleset rather than by convention.
#
# What runs when dependencies changed:
#   * osv            -- google/osv-scanner PR diff against OSV.dev. Fails only
#                       on advisories NEW in this PR (pre-existing ones don't
#                       block the fix). OSV.dev carries the OpenSSF
#                       malicious-packages feed (MAL-* ids), e.g. the Aug 2026
#                       keyv@6.0.0 compromise is MAL-2026-11524 -- so this is a
#                       malware gate, not just a CVE gate.
#   * install-policy -- every Cargo.toml covered by its workspace's Cargo.lock; crate sources
#                       registry-only (cargo metadata --locked); .cargo/config may not
#                       override sources/registries/transport; cargo fetch --locked.
#   * actions-pins   -- on EVERY PR: every NEWLY
#                       ADDED executable reference (parsed from the YAML at the
#                       merge-base and head, per file and per occurrence: step
#                       and reusable-workflow `uses:`, job container / service
#                       images, local ./actions expanded, docker-action images)
#                       must be pinned: a floating branch ref, no version, or an
#                       image without an @sha256 digest fails; a tag pin warns --
#                       SHA pinning of the whole fleet's workflows is a separate
#                       decision, ADR-0014 open questions.
#
# THREAT MODEL / KNOWN LIMIT: this gate defends against malicious DEPENDENCY
# CONTENT. It does not defend against a PR author who rewrites this file --
# on a same-repo PR a `pull_request` workflow runs the PR's own definition.
# The fleet's PR authors are a single trusted identity that can already edit
# any workflow (CI included); a compromised author identity is the
# credential-rotation runbook's domain (dispensa docs/runbooks). GitHub's
# "require workflows to pass" ruleset rule (base-controlled definition) is
# Enterprise-only; `pull_request_target` would run untrusted PR content under
# the base definition AND break the OSV base/head diff (GITHUB_SHA is the base
# there). Every action below is pinned to a full commit SHA so the verifier
# itself cannot change underneath the check.
on:
  pull_request:
    branches: [main]
  # A merge queue requests the same required context for its temporary
  # merge-group SHA; the scans then run against merge_group.base_sha/head_sha.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  changes:
    name: Detect dependency changes
    runs-on: ubuntu-latest
    # paths-filter lists the PR's files through the API on pull_request events;
    # without pull-requests:read it fails "Resource not accessible by
    # integration" (seen live on the first run of this workflow).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          base: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          filters: |
            deps:
              - '**/package.json'
              - '**/package-lock.json'
              - '**/npm-shrinkwrap.json'
              - '**/pnpm-lock.yaml'
              - '**/pnpm-workspace.yaml'
              - '**/.npmrc'
              - '**/.pnpmfile.cjs'
              - '**/yarn.lock'
              - '**/bun.lock'
              - '**/bun.lockb'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/.cargo/config'
              - '**/.cargo/config.toml'
              - '.github/workflows/**'
              - '**/action.yml'
              - '**/action.yaml'
              - '**/Dockerfile*'
              - '**/dockerfile*'
              - '**/*.Dockerfile'
              - '**/*.dockerfile'
  # The differential PR scan (osv-scanner-reusable-pr.yml) relies on
  # GITHUB_BASE_REF to check out the base ref -- that variable is only
  # populated for pull_request(_target) events and is EMPTY for merge_group,
  # so calling it there checks out nothing and silently fails to compute a
  # base scan (Codex round 1, pancetta #291). merge_group gets its own job
  # running a full (non-diff) scan of the merge commit instead: every
  # constituent PR was already diff-scanned before entering the queue, so a
  # full scan here is a correct, simpler final gate, not a downgrade.
  osv-pr:
    name: OSV advisories (incl. malicious-package MAL-*)
    needs: changes
    if: needs.changes.outputs.deps == 'true' && github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      # The job conclusion is the gate; code-scanning upload needs GitHub
      # Advanced Security on private repos and is not what we're relying on.
      upload-sarif: false
      fail-on-vuln: true

  # A full (non-diff) scan here would ALSO fail on any advisory already
  # present on main before this merge group -- exactly what the PR-diff scan
  # is designed to tolerate -- rejecting every dependency-changing merge-queue
  # entry forever once one exists on main (Codex round 2, pancetta #291).
  # GITHUB_SHA (used below) IS correctly the merge group's own SHA for this
  # event; only GITHUB_BASE_REF is empty (pull_request(_target)-only), so
  # this mirrors osv-scanner-reusable-pr.yml's own steps -- same pinned
  # action SHAs -- substituting merge_group.base_sha for the base checkout.
  osv-merge-group:
    name: OSV advisories (incl. malicious-package MAL-*) -- merge group
    needs: changes
    if: needs.changes.outputs.deps == 'true' && github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # google/osv-scanner-action's scanner/reporter run as Docker container
      # actions, which only see $GITHUB_WORKSPACE (not $RUNNER_TEMP -- a host
      # path the container can't reach), so scan outputs must live INSIDE the
      # checkout. An unpredictable, per-run directory name means a PR cannot
      # pre-commit a colliding tracked path, so the later `git checkout -f`
      # (which only overwrites paths the target commit itself tracks) leaves it
      # alone -- closing the tamperable-results-file gap without breaking the
      # scan under a Docker action (Codex round, widdershins #219).
      - name: "Prepare an unpredictable scan-output directory"
        run: |
          dir=".osv-scan-${GITHUB_RUN_ID}-${RANDOM}${RANDOM}"
          mkdir -p "$dir"
          echo "OSV_SCAN_DIR=$dir" >> "$GITHUB_ENV"
      - name: "Checkout base of the merge group"
        run: git checkout ${{ github.event.merge_group.base_sha }}
      # Written under $RUNNER_TEMP, outside the checkout -- a PR that commits a
      # tracked file literally named old-results.json would otherwise have it
      # replace this step's genuine output the moment `git checkout -f` runs
      # next, letting the reporter treat a PR-fabricated "no advisories"
      # baseline as the real pre-PR scan (Codex round, widdershins #219).
      - name: "Run scanner on existing code"
        uses: google/osv-scanner-action/osv-scanner-action@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.1
        env:
          GOTOOLCHAIN: auto
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=${{ env.OSV_SCAN_DIR }}/old-results.json
            -r
            ./
      - name: "Checkout head of the merge group"
        run: git checkout -f "$GITHUB_SHA"
      - name: "Run scanner on new code"
        uses: google/osv-scanner-action/osv-scanner-action@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.1
        env:
          GOTOOLCHAIN: auto
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=${{ env.OSV_SCAN_DIR }}/new-results.json
            -r
            ./
      - name: "Run osv-scanner-reporter"
        uses: google/osv-scanner-action/osv-reporter-action@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.1
        with:
          scan-args: |-
            --output=${{ env.OSV_SCAN_DIR }}/results.sarif
            --old=${{ env.OSV_SCAN_DIR }}/old-results.json
            --new=${{ env.OSV_SCAN_DIR }}/new-results.json
            --gh-annotations=true
            --fail-on-vuln=true

  install-policy:
    name: Lockfile integrity (cargo fetch --locked) + source policy
    # Runs only after OSV has PASSED (see the pnpm repos' gate for the rationale).
    needs: [changes, osv-pr, osv-merge-group]
    # always(): without an explicit status-check function, GH Actions implicitly
    # ANDs "&& success()" onto a custom `if:` -- since exactly one of osv-pr/
    # osv-merge-group is ALWAYS 'skipped' by design, that implicit check would
    # fail on every run and this job would never execute at all (Codex round 8,
    # cqdx #349) -- ci.yml's analogous gate already uses always() for the same
    # reason. Event-specific success, not "either succeeded or skipped": the
    # earlier form tolerated BOTH osv-pr and osv-merge-group being 'skipped'
    # simultaneously, so an unexpected event where neither OSV job actually ran
    # still let this job proceed. Require the ACTIVE event's own OSV job to
    # have succeeded; the inactive counterpart's result is never even checked,
    # since it's expected to be 'skipped' by its own if: gate (Codex round,
    # vanity #153 / CAT-315).
    if: |
      always() &&
      needs.changes.outputs.deps == 'true' &&
      ((github.event_name == 'pull_request' && needs.osv-pr.result == 'success') ||
       (github.event_name == 'merge_group' && needs.osv-merge-group.result == 'success'))
    runs-on: ubuntu-latest
    env:
      # Single source of truth for which lockfile kinds this repo's gate
      # actually validates -- read by both the bootstrap step's `if:` below
      # and the coverage-check step (which passes it straight through as
      # argv[1] instead of a second hardcoded literal). This repo has no
      # JS/pnpm manifest today (Rust/cargo only), so "cargo" is the only
      # kind accepted and the npm/pnpm resolver bootstrap is skipped
      # entirely (Codex, CAT-318): the two upstream tools it verifies are
      # otherwise fetched from the npm registry on every dependency-changing
      # PR for zero benefit, and an npm outage/rate-limit could then block
      # an otherwise-valid Cargo-only PR for tooling this gate never calls.
      WORKSPACE_ACCEPT: cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # The npm/pnpm workspace-glob matchers below are themselves a dependency
      # of this gate's own trust chain, same reasoning as the pnpm bootstrap
      # above: each installed from a pinned version + byte-verified tarball
      # digest, into an ISOLATED prefix (never the repo's own node_modules or
      # lockfile), with --ignore-scripts, so neither becomes the unverified
      # root of a gate that claims pre-install trust. Delegates real
      # npm/pnpm workspace-glob resolution to npm's and pnpm's own published
      # tools instead of a hand-maintained reimplementation, after an
      # extended chase of hand-rolled-parser edge cases (CAT-314/315/316)
      # made clear that reproducing minimatch/pnpm's real (sometimes
      # pathological) semantics by hand doesn't converge. Also closes a real
      # gap this repo's pnpm-side coverage check had (see below): it trusted
      # every pnpm-lock.yaml importer as covered with no cross-check against
      # pnpm-workspace.yaml's globs at all -- cqdx#349 already fixed this
      # class of issue for cqdx specifically; it never propagated here
      # (CAT-318). Only runs when WORKSPACE_ACCEPT actually names npm/pnpm
      # (see the job env above) -- this repo's gate never accepts either
      # today, so the step is a no-op skip here (Codex round, CAT-318).
      - name: Bootstrap real npm/pnpm workspace resolvers from a pinned, integrity-verified lockfile
        if: contains(env.WORKSPACE_ACCEPT, 'npm') || contains(env.WORKSPACE_ACCEPT, 'pnpm')
        run: |
          # Byte-verifying just the two top-level tarballs isn't enough: a plain
          # `npm install` also resolves and installs each tool's own transitive
          # dependencies fresh on every run, unpinned -- a dependency range could
          # resolve to a different, validly-signed-but-compromised release on a
          # later run and execute its require()'d code with no check catching it
          # (Codex round, CAT-318 follow-up). Instead, install from a checked-in
          # package-lock.json (.github/workflows/vendor/workspace-resolvers/) that
          # pins an exact resolved version + integrity hash for the FULL
          # transitive closure (210 packages) -- `npm ci` refuses to proceed if
          # anything it downloads doesn't match the lockfile's pinned integrity
          # hash, byte-for-byte, deterministically every run. This is npm's own
          # standard mechanism for exactly this problem, not a hand-rolled one --
          # the same "delegate to the real tool" reasoning CAT-318 itself is
          # built on. `npm audit signatures` on top additionally verifies registry
          # provenance (the lockfile pins integrity, not who published it).
          set -euo pipefail
          prefix=$(mktemp -d)
          cp .github/workflows/vendor/workspace-resolvers/package.json \
             .github/workflows/vendor/workspace-resolvers/package-lock.json \
             "$prefix/"
          (cd "$prefix" && npm ci --ignore-scripts --no-audit --no-fund --loglevel=error)
          if ! npm audit signatures --prefix "$prefix" >/dev/null; then
            echo "::error::one or more packages in the workspace-resolver dependency closure failed registry signature verification -- refusing to use them"; exit 1
          fi
          echo "WS_RESOLVERS_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "Bootstrapped @npmcli/map-workspaces and @pnpm/find-workspace-packages from a pinned, integrity-verified lockfile into $prefix"
      # 0. Every manifest must be covered by a lockfile this gate validates
      #    (pnpm importer / sibling package-lock.json / a package of the Cargo
      #    workspace its Cargo.lock actually locks); yarn/bun/shrinkwrap are
      #    refused rather than silently passed. Every manifest and lockfile
      #    kind named here is also in the detector above, so a PR that adds
      #    only a refused kind still reaches this step.
      - name: Every manifest is covered by a validated lockfile
        run: |
          python3 -c 'import yaml' || { echo '::error::PyYAML is not on this runner -- refusing to install anything inside the verifier'; exit 1; }
          python3 - "$WORKSPACE_ACCEPT" <<'PY'
          import os, sys, yaml
          # Every npm/pnpm manifest must be covered by a lockfile this gate validates
          # (CAT-299 / ADR-0014, local review gate round 5): a package.json is covered if
          # it is an importer of a pnpm-lock.yaml (workspace member) or has a sibling
          # package-lock.json / pnpm-lock.yaml. yarn.lock / bun.lock are NOT validated by
          # this gate and are refused outright rather than silently passed.
          # argv[1]: comma-separated lockfile kinds this repo's gate actually validates
          # (pnpm,npm[,cargo] for pnpm workspaces; npm only for an npm repo; cargo for Rust),
          # passed through from the job-level WORKSPACE_ACCEPT env var (single source of
          # truth shared with the resolver-bootstrap step's `if:` above -- CAT-318). A
          # lockfile of any other kind is refused, never counted as coverage (local gate round 6).
          ACCEPT = set((sys.argv[1] if len(sys.argv) > 1 else "pnpm,npm").split(","))
          PRUNE = {"node_modules", "target", ".git", ".worktrees"}
          manifests, covered, refused = [], set(), []
          # a symlinked manifest / lockfile / package-manager config is refused: the tools
          # follow the link, but a change to its differently-named target would not be
          # detected as a dependency change
          SYMLINK_NAMES = {"package.json", "package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".npmrc", ".pnpmfile.cjs", "Cargo.toml", "Cargo.lock", "yarn.lock", "bun.lock", "bun.lockb"}

          import json, subprocess

          def _resolve_workspace_dirs(root, raw_patterns, kind):
              """Delegates workspace-glob resolution to the REAL npm/pnpm tool
              (bootstrapped from a pinned, integrity-verified lockfile -- see the
              'Bootstrap real npm/pnpm workspace resolvers' step) instead of a
              hand-maintained reimplementation (CAT-318). Returns the set of
              real, existing directories (relative to root, normalized) the
              tool actually selects -- extglobs, negation (npm's resurrection
              model and pnpm's distinct order-independent-absolute model
              alike), and every other real semantic by construction, since
              this IS the same code npm/pnpm itself uses.

              Empty/absent raw_patterns means ZERO non-root members for
              BOTH npm and pnpm -- not "pass through so the tool applies
              its own default". A prior version of this function passed
              `None` straight through for pnpm on the theory that pnpm's
              own default is "root + every subdirectory"; that was wrong
              (round-3 fix, reversed by round 4 -- see the caller's own
              comment below for the pinned-binary verification). npm has
              no implicit `workspaces` default at all (absent means none)
              -- same zero-coverage conclusion, different reason. Only an
              explicit non-empty glob list ever reaches the resolver
              below -- the caller is responsible for never passing `None`
              here in the first place."""
              if not raw_patterns:
                  return set()
              prefix = os.environ["WS_RESOLVERS_PREFIX"]
              abs_root = os.path.abspath(root)
              if kind == "npm":
                  script = (
                      "const path = require('path');"
                      "const mapWorkspaces = require(process.env.WS_RESOLVERS_PREFIX + '/node_modules/@npmcli/map-workspaces');"
                      "(async () => {"
                      "  const cwd = process.argv[1];"
                      "  const workspaces = JSON.parse(process.argv[2]);"
                      "  const m = await mapWorkspaces({ cwd, pkg: { workspaces } });"
                      "  process.stdout.write(JSON.stringify([...m.values()].map(p => path.relative(cwd, p) || '.')));"
                      "})().catch(e => { console.error(e); process.exit(1); });"
                  )
              else:
                  script = (
                      "const path = require('path');"
                      "const { findWorkspacePackagesNoCheck } = require(process.env.WS_RESOLVERS_PREFIX + '/node_modules/@pnpm/find-workspace-packages');"
                      "(async () => {"
                      "  const cwd = process.argv[1];"
                      "  const patterns = JSON.parse(process.argv[2]);"
                      "  const pkgs = await findWorkspacePackagesNoCheck(cwd, { patterns });"
                      "  process.stdout.write(JSON.stringify(pkgs.map(p => path.relative(cwd, p.dir) || '.')));"
                      "})().catch(e => { console.error(e); process.exit(1); });"
                  )
              result = subprocess.run(["node", "-e", script, "--", abs_root, json.dumps(raw_patterns)], capture_output=True, text=True, timeout=60)
              if result.returncode != 0:
                  raise RuntimeError(f"workspace resolution ({kind}) failed for {root}: {result.stderr}")
              return {os.path.normpath(p) for p in json.loads(result.stdout)}

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in PRUNE]
              for f in files:
                  if f in SYMLINK_NAMES and os.path.islink(os.path.join(root, f)):
                      refused.append(os.path.normpath(os.path.join(root, f)) + " (symlink)")
              for d in list(dirs):
                  if d == ".cargo" and os.path.islink(os.path.join(root, d)): refused.append(os.path.normpath(os.path.join(root, d)) + " (symlinked .cargo dir)")
              if os.path.basename(root) == ".cargo":
                  for f in ("config", "config.toml"):
                      if f in files and os.path.islink(os.path.join(root, f)): refused.append(os.path.normpath(os.path.join(root, f)) + " (symlink)")
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in PRUNE]
              rel = os.path.normpath(root)
              # The npm/pnpm workspace-resolver bootstrap (CAT-318) is CI's own
              # tooling, not an application dependency: it is pinned and
              # signature-verified by its own dedicated install-policy step
              # (ignore-scripts enforcement, per-entry registry-signature check,
              # `npm ci`, `npm audit signatures` -- strictly more than this
              # generic coverage check provides) whenever WORKSPACE_ACCEPT
              # actually names npm/pnpm, and is unused dead weight otherwise
              # (e.g. this Cargo-only gate) -- either way it should not be
              # double-counted or refused here.
              if rel == os.path.normpath(".github/workflows/vendor/workspace-resolvers"):
                  continue
              if "package.json" in files:
                  manifests.append(rel)
              if "package-lock.json" in files:
                  if "npm" in ACCEPT:
                      covered.add(rel)
                      try:
                          import json
                          lock = json.load(open(os.path.join(root, "package-lock.json")))
                          pkgs = lock.get("packages") or {}
                          ws = (json.load(open(os.path.join(root, "package.json"))) if os.path.exists(os.path.join(root, "package.json")) else {}).get("workspaces") or []
                          if isinstance(ws, dict): ws = ws.get("packages") or []
                          ws = [g for g in ws if isinstance(g, str)]
                          real_dirs = _resolve_workspace_dirs(root, ws, "npm")
                          link_targets = {os.path.normpath(m["resolved"]) for m in pkgs.values() if isinstance(m, dict) and m.get("link") and isinstance(m.get("resolved"), str)}
                          for key in pkgs:
                              # an npm workspace member is covered only when the ROOT manifest
                              # declares it (workspaces globs) AND the lock links to it -- a
                              # handcrafted lock key alone grants nothing
                              nk = os.path.normpath(key)
                              if key and "node_modules/" not in key and not nk.startswith("..") and nk in link_targets \
                                      and nk in real_dirs:
                                  covered.add(os.path.normpath(os.path.join(rel, nk)))
                      except (ValueError, OSError):
                          pass                                                 # the verifier step rejects an unparseable lock
                  else:
                      refused.append(os.path.join(rel, "package-lock.json"))
              if "pnpm-lock.yaml" in files:
                  if "pnpm" in ACCEPT:
                      covered.add(rel)
                      lock = yaml.safe_load(open(os.path.join(root, "pnpm-lock.yaml"))) or {}
                      # an importer other than the root (".") is covered only when
                      # pnpm-workspace.yaml's `packages` globs actually select it -- a
                      # hand-added lock-only importer key with no matching workspace
                      # declaration is ignored by `pnpm install --frozen-lockfile` (it
                      # only installs importers pnpm itself resolves from the workspace
                      # globs), so trusting the raw importers map alone previously granted
                      # coverage to a manifest pnpm never actually installs or verifies
                      # (cqdx#349's class of finding, closed here too via CAT-318).
                      pwy_path = os.path.join(root, "pnpm-workspace.yaml")
                      pwy = (yaml.safe_load(open(pwy_path)) or {}) if os.path.exists(pwy_path) else {}
                      # The pinned pnpm CLI normalizes a missing/omitted `packages` key --
                      # whether pnpm-workspace.yaml is absent entirely, present but omits
                      # the key, or sets it to an explicit `[]` -- to root-only before any
                      # install; it does NOT fall through to @pnpm/fs.find-packages' own
                      # library-level recursive ['.', '**'] default the way calling
                      # findWorkspacePackagesNoCheck directly (with patterns=None) does.
                      # Verified against the pinned pnpm 11.22.0 binary itself, not just
                      # its source: `pnpm install --lockfile-only` and `pnpm -r list`
                      # against a workspace file with no `packages` key both show only the
                      # "." importer -- identical to no workspace file at all. This
                      # reverses the earlier round-3 "let pnpm apply its own default" fix,
                      # which relied on the library's coded fallback rather than the CLI's
                      # actual behaviour (Codex round, CAT-318 follow-up). A stale or
                      # hand-added subdirectory importer must not be granted coverage a
                      # real `pnpm install --frozen-lockfile` would never check.
                      pnpm_ws = [g for g in (pwy.get("packages") or []) if isinstance(g, str)]
                      real_dirs = _resolve_workspace_dirs(root, pnpm_ws, "pnpm")
                      for imp in (lock.get("importers") or {}):
                          nimp = os.path.normpath(imp)
                          if nimp == "." or nimp in real_dirs:
                              covered.add(os.path.normpath(os.path.join(rel, imp)))
                  else:
                      refused.append(os.path.join(rel, "pnpm-lock.yaml"))
              for f in ("yarn.lock", "bun.lock", "bun.lockb"):
                  if f in files:
                      refused.append(os.path.join(rel, f))
          # Cargo manifests: a Cargo.toml is covered only if it is a package of the
