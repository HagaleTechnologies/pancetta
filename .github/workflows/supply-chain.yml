name: Supply Chain

# (CAT-299) Supply-chain gate for dependency changes. Governance: dispensa ADR-0014.
#
# WHY THIS RUNS ON EVERY PR: the job named "Supply Chain" below is a
# ruleset-required status check on main. A required check that only ran on
# some PRs would leave every other PR stuck at "Expected -- waiting for
# status" forever, so this workflow runs on every PR and passes trivially
# when no dependency manifest, lockfile, or workflow changed. When one DID
# change, the scanners run and GitHub's native auto-merge (armed by
# auto-merge.yml / dependabot-auto-merge.yml via `gh pr merge --auto`)
# cannot fire until they pass -- that is the "dependency bumps are excluded
# from blanket standing auto-merge until a scan passes" carve-out, enforced
# by the ruleset rather than by convention.
#
# What runs when dependencies changed:
#   * osv            -- google/osv-scanner PR diff against OSV.dev. Fails only
#                       on advisories NEW in this PR (pre-existing ones don't
#                       block the fix). OSV.dev carries the OpenSSF
#                       malicious-packages feed (MAL-* ids), e.g. the Aug 2026
#                       keyv@6.0.0 compromise is MAL-2026-11524 -- so this is a
#                       malware gate, not just a CVE gate.
#   * install-policy -- every Cargo.toml covered by its workspace's Cargo.lock; crate sources
#                       registry-only (cargo metadata --locked); .cargo/config may not
#                       override sources/registries/transport; cargo fetch --locked.
#   * actions-pins   -- on EVERY PR: every NEWLY
#                       ADDED executable reference (parsed from the YAML at the
#                       merge-base and head, per file and per occurrence: step
#                       and reusable-workflow `uses:`, job container / service
#                       images, local ./actions expanded, docker-action images)
#                       must be pinned: a floating branch ref, no version, or an
#                       image without an @sha256 digest fails; a tag pin warns --
#                       SHA pinning of the whole fleet's workflows is a separate
#                       decision, ADR-0014 open questions.
#
# THREAT MODEL / KNOWN LIMIT: this gate defends against malicious DEPENDENCY
# CONTENT. It does not defend against a PR author who rewrites this file --
# on a same-repo PR a `pull_request` workflow runs the PR's own definition.
# The fleet's PR authors are a single trusted identity that can already edit
# any workflow (CI included); a compromised author identity is the
# credential-rotation runbook's domain (dispensa docs/runbooks). GitHub's
# "require workflows to pass" ruleset rule (base-controlled definition) is
# Enterprise-only; `pull_request_target` would run untrusted PR content under
# the base definition AND break the OSV base/head diff (GITHUB_SHA is the base
# there). Every action below is pinned to a full commit SHA so the verifier
# itself cannot change underneath the check.
on:
  pull_request:
    branches: [main]
  # A merge queue requests the same required context for its temporary
  # merge-group SHA; the scans then run against merge_group.base_sha/head_sha.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  changes:
    name: Detect dependency changes
    runs-on: ubuntu-latest
    # paths-filter lists the PR's files through the API on pull_request events;
    # without pull-requests:read it fails "Resource not accessible by
    # integration" (seen live on the first run of this workflow).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          base: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          filters: |
            deps:
              - '**/package.json'
              - '**/package-lock.json'
              - '**/npm-shrinkwrap.json'
              - '**/pnpm-lock.yaml'
              - '**/pnpm-workspace.yaml'
              - '**/.npmrc'
              - '**/.pnpmfile.cjs'
              - '**/yarn.lock'
              - '**/bun.lock'
              - '**/bun.lockb'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/.cargo/config'
              - '**/.cargo/config.toml'
              - '.github/workflows/**'
              - '**/action.yml'
              - '**/action.yaml'
              - '**/Dockerfile*'
              - '**/dockerfile*'
              - '**/*.Dockerfile'
              - '**/*.dockerfile'
  # The differential PR scan (osv-scanner-reusable-pr.yml) relies on
  # GITHUB_BASE_REF to check out the base ref -- that variable is only
  # populated for pull_request(_target) events and is EMPTY for merge_group,
  # so calling it there checks out nothing and silently fails to compute a
  # base scan (Codex round 1, pancetta #291). merge_group gets its own job
  # running a full (non-diff) scan of the merge commit instead: every
  # constituent PR was already diff-scanned before entering the queue, so a
  # full scan here is a correct, simpler final gate, not a downgrade.
  osv-pr:
    name: OSV advisories (incl. malicious-package MAL-*)
    needs: changes
    if: needs.changes.outputs.deps == 'true' && github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    with:
      # The job conclusion is the gate; code-scanning upload needs GitHub
      # Advanced Security on private repos and is not what we're relying on.
      upload-sarif: false
      fail-on-vuln: true

  # A full (non-diff) scan here would ALSO fail on any advisory already
  # present on main before this merge group -- exactly what the PR-diff scan
  # is designed to tolerate -- rejecting every dependency-changing merge-queue
  # entry forever once one exists on main (Codex round 2, pancetta #291).
  # GITHUB_SHA (used below) IS correctly the merge group's own SHA for this
  # event; only GITHUB_BASE_REF is empty (pull_request(_target)-only), so
  # this mirrors osv-scanner-reusable-pr.yml's own steps -- same pinned
  # action SHAs -- substituting merge_group.base_sha for the base checkout.
  osv-merge-group:
    name: OSV advisories (incl. malicious-package MAL-*) -- merge group
    needs: changes
    if: needs.changes.outputs.deps == 'true' && github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: "Checkout base of the merge group"
        run: git checkout ${{ github.event.merge_group.base_sha }}
      - name: "Run scanner on existing code"
        uses: google/osv-scanner-action/osv-scanner-action@baa4139e56d6312335d899e6ba045fa16d1d3d0b # v2.5.1
        env:
          GOTOOLCHAIN: auto
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=old-results.json
            -r
            ./
      - name: "Checkout head of the merge group"
        run: git checkout -f "$GITHUB_SHA"
      - name: "Run scanner on new code"
        uses: google/osv-scanner-action/osv-scanner-action@baa4139e56d6312335d899e6ba045fa16d1d3d0b # v2.5.1
        env:
          GOTOOLCHAIN: auto
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=new-results.json
            -r
            ./
      - name: "Run osv-scanner-reporter"
        uses: google/osv-scanner-action/osv-reporter-action@baa4139e56d6312335d899e6ba045fa16d1d3d0b # v2.5.1
        with:
          scan-args: |-
            --output=results.sarif
            --old=old-results.json
            --new=new-results.json
            --gh-annotations=true
            --fail-on-vuln=true

  install-policy:
    name: Lockfile integrity (cargo fetch --locked) + source policy
    # Runs only after OSV has PASSED (see the pnpm repos' gate for the rationale).
    needs: [changes, osv-pr, osv-merge-group]
    # always(): without an explicit status-check function, GH Actions implicitly
    # ANDs "&& success()" onto a custom `if:` -- since exactly one of osv-pr/
    # osv-merge-group is ALWAYS 'skipped' by design, that implicit check would
    # fail on every run and this job would never execute at all (Codex round 8,
    # cqdx #349) -- ci.yml's analogous gate already uses always() for the same
    # reason.
    if: |
      always() &&
      needs.changes.outputs.deps == 'true' &&
      (needs.osv-pr.result == 'success' || needs.osv-pr.result == 'skipped') &&
      (needs.osv-merge-group.result == 'success' || needs.osv-merge-group.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # 0. Every manifest must be covered by a lockfile this gate validates
      #    (pnpm importer / sibling package-lock.json / a package of the Cargo
      #    workspace its Cargo.lock actually locks); yarn/bun/shrinkwrap are
      #    refused rather than silently passed. Every manifest and lockfile
      #    kind named here is also in the detector above, so a PR that adds
      #    only a refused kind still reaches this step.
      - name: Every manifest is covered by a validated lockfile
        run: |
          python3 -c 'import yaml' || { echo '::error::PyYAML is not on this runner -- refusing to install anything inside the verifier'; exit 1; }
          python3 - cargo <<'PY'
          import os, sys, yaml
          # Every npm/pnpm manifest must be covered by a lockfile this gate validates
          # (CAT-299 / ADR-0014, local review gate round 5): a package.json is covered if
          # it is an importer of a pnpm-lock.yaml (workspace member) or has a sibling
          # package-lock.json / pnpm-lock.yaml. yarn.lock / bun.lock are NOT validated by
          # this gate and are refused outright rather than silently passed.
          # argv[1]: comma-separated lockfile kinds this repo's gate actually validates
          # (pnpm,npm[,cargo] for pnpm workspaces; npm only for an npm repo; cargo for Rust). A lockfile of any
          # other kind is refused, never counted as coverage (local gate round 6).
          ACCEPT = set((sys.argv[1] if len(sys.argv) > 1 else "pnpm,npm").split(","))
          PRUNE = {"node_modules", "target", ".git", ".worktrees"}
          manifests, covered, refused = [], set(), []
          # a symlinked manifest / lockfile / package-manager config is refused: the tools
          # follow the link, but a change to its differently-named target would not be
          # detected as a dependency change
          SYMLINK_NAMES = {"package.json", "package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".npmrc", ".pnpmfile.cjs", "Cargo.toml", "Cargo.lock", "yarn.lock", "bun.lock", "bun.lockb"}
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in PRUNE]
              for f in files:
                  if f in SYMLINK_NAMES and os.path.islink(os.path.join(root, f)):
                      refused.append(os.path.normpath(os.path.join(root, f)) + " (symlink)")
              for d in list(dirs):
                  if d == ".cargo" and os.path.islink(os.path.join(root, d)): refused.append(os.path.normpath(os.path.join(root, d)) + " (symlinked .cargo dir)")
              if os.path.basename(root) == ".cargo":
                  for f in ("config", "config.toml"):
                      if f in files and os.path.islink(os.path.join(root, f)): refused.append(os.path.normpath(os.path.join(root, f)) + " (symlink)")
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in PRUNE]
              rel = os.path.normpath(root)
              if "package.json" in files:
                  manifests.append(rel)
              if "package-lock.json" in files:
                  if "npm" in ACCEPT:
                      covered.add(rel)
                      try:
                          import json, re as _re
                          def ws_match(pattern, path):
                              """npm/minimatch-style: `*`/`?` never cross `/`, `**` does, `{a,b}` alternates
                              (brace groups are expanded into separate full patterns first -- matching
                              minimatch/brace-expansion order -- so an alternative that itself begins with
                              a literal `.` is judged independently). Dotfile rule (npm's workspace mapper
                              calls glob without dot:true): `*`, `?`, `**`, or an extglob/bracket token that
                              does not ITSELF spell a literal leading `.` does not match a `.`-prefixed path
                              SEGMENT (verified against the real `minimatch` 10.2.5 npm ships: `{.internal,x}`,
                              `@(.internal|x)` and `[.]internal` all match `.internal`; a bare `*`/`?`/`[!.]`
                              does not -- Codex round, widdershins #219)."""
                              pattern = _re.sub(r"\{(\d+)\.\.(\d+)\}", lambda m: "{" + ",".join(str(i) for i in range(int(m.group(1)), int(m.group(2)) + 1)) + "}", pattern)   # {1..3}
                              pattern = _re.sub(r"\{([A-Za-z])\.\.([A-Za-z])\}", lambda m: "{" + ",".join(chr(i) for i in range(ord(m.group(1)), ord(m.group(2)) + 1)) + "}", pattern)   # {a..c}
                              def brace_expand(pat):
                                  m = _re.search(r"\{([^{}]*)\}", pat)
                                  if not m: return [pat]
                                  out = []
                                  for alt in m.group(1).split(","):
                                      out.extend(brace_expand(pat[:m.start()] + alt + pat[m.end():]))
                                  return out
                              def translate(pattern):
                                  out, i, seg_start = "", 0, True
                                  guard = lambda tok: ("(?!\\.)" + tok) if seg_start else tok
                                  while i < len(pattern):
                                      c = pattern[i]
                                      eg = _re.match(r"([@+*?!])\((.*?)\)", pattern[i:])     # extglobs @(a|b) +(x) *(x) ?(x) !(x)
                                      if eg:
                                          alts = eg.group(2).split("|")
                                          if eg.group(1) == "!":
                                              inner = "|".join(_re.escape(a) for a in alts)
                                              out += guard("(?:(?!(?:" + inner + ")(?:/|$))[^/]+)")   # one segment that is not any alternative
                                          else:
                                              dotalts = [a for a in alts if a.startswith(".")]         # explicit -- not guarded
                                              rest = [a for a in alts if not a.startswith(".")]
                                              mixed = "(?:" + "|".join(_re.escape(a) for a in alts) + ")"   # ANY alt, unguarded -- used
                                              # once we are past the first character of the segment, so later
                                              # repetitions of +()/*() may freely mix dotted and undotted
                                              # alternatives (`+(.internal|x)` matches `.internalx` too --
                                              # splitting into separately-repeated per-class groups broke this;
                                              # Codex round, vanity #153).
                                              def first_choice():
                                                  parts = []
                                                  if dotalts: parts.append("(?:" + "|".join(_re.escape(a) for a in dotalts) + ")")
                                                  if rest: parts.append(guard("(?:" + "|".join(_re.escape(a) for a in rest) + ")"))
                                                  return "(?:" + "|".join(parts) + ")" if len(parts) > 1 else (parts[0] if parts else "(?!x)x")
                                              kind = eg.group(1)
                                              if kind in ("@", "?"):
                                                  out += first_choice() + ({"@": "", "?": "?"}[kind])
                                              elif kind == "+":
                                                  out += first_choice() + mixed + "*"
                                              else:  # "*" -- zero or more, mixed freely once started
                                                  out += "(?:" + first_choice() + mixed + "*)?"
                                          i += eg.end(); seg_start = False; continue
                                      if pattern.startswith("**/", i): out += "(?:(?!\\.)[^/]+/)*"; i += 3; seg_start = True; continue      # zero or more non-dot directories
                                      elif pattern.startswith("**", i): out += guard("(?:[^/]+(?:/(?!\\.)[^/]+)*)?"); i += 2; seg_start = False; continue
                                      elif c == "*": out += guard("[^/]*"); i += 1; seg_start = False; continue
                                      elif c == "?": out += guard("[^/]"); i += 1; seg_start = False; continue
                                      elif c == "[":
                                          j = pattern.find("]", i + 2)
                                          if j == -1: out += _re.escape(c); i += 1; seg_start = False
                                          else:
                                              cls = pattern[i + 1:j]
                                              negated = cls.startswith("!")
                                              core = cls[1:] if negated else cls
                                              allows_dot = ("." in core) and not negated                  # e.g. [.] or [.abc] -- explicit
                                              cls = ("^" + core) if negated else cls
                                              tok = "[" + cls.replace("\\", "\\\\") + "]"
                                              out += tok if allows_dot else guard(tok); i = j + 1; seg_start = False
                                          continue
                                      elif c == "/": out += "/"; i += 1; seg_start = True; continue
                                      else: out += _re.escape(c); i += 1; seg_start = False; continue
                                  return out
                              return any(_re.fullmatch(translate(p), path) for p in brace_expand(pattern))
                          lock = json.load(open(os.path.join(root, "package-lock.json")))
                          pkgs = lock.get("packages") or {}
                          ws = (json.load(open(os.path.join(root, "package.json"))) if os.path.exists(os.path.join(root, "package.json")) else {}).get("workspaces") or []
                          if isinstance(ws, dict): ws = ws.get("packages") or []
                          ws = [os.path.normpath(g) for g in ws if isinstance(g, str)]
                          def _ws_prepare(raw_patterns):
                              """Faithfully mirrors @npmcli/map-workspaces's appendNegatedPatterns:
                              negation is NOT a simple per-path last-match-wins toggle. A later
                              POSITIVE pattern cancels an earlier negation only when the positive
                              pattern's own literal text would itself be matched AS A PATH by that
                              negated glob (e.g. an exact re-list, or a negation of `pkg/b/**`
                              cancelled by the specific `pkg/b/a`) -- a broader wildcard like
                              `packages/*` following `!packages/private` does NOT resurrect it
                              (verified against the real @npmcli/map-workspaces 5.0.3; Codev round,
                              widdershins #219)."""
                              positive, negated = [], []
                              for raw in raw_patterns:
                                  if not isinstance(raw, str): continue
                                  m = _re.match(r"^(!+)", raw)
                                  excl = m.group(1) if m else ""
                                  pat = _re.sub(r"^\.?/+", "", raw[len(excl):])   # strip a leading ./ or /
                                  if len(excl) % 2 == 1:
                                      negated.append(pat)
                                  else:
                                      # mirror npm's own for-loop-with-splice EXACTLY, including its
                                      # off-by-one: the loop index always advances even after a
                                      # deletion shifts the list, so an element that shifts into the
                                      # just-vacated slot is never re-checked -- an adjacent DUPLICATE
                                      # negation only ever cancels once, leaving one copy to still
                                      # exclude the path (Codex local round, widdershins #219).
                                      i = 0
                                      while i < len(negated):
                                          if ws_match(negated[i], pat): del negated[i]
                                          i += 1
                                      positive.append(pat)
                              positive = [p for p in positive if not any(ws_match(np, p) for np in negated)]
                              return positive, negated
                          _ws_positive, _ws_negated = _ws_prepare(ws)
                          def ws_selected(path):
                              if any(ws_match(np, path) for np in _ws_negated): return False
                              return any(ws_match(p, path) for p in _ws_positive)
                          link_targets = {os.path.normpath(m["resolved"]) for m in pkgs.values() if isinstance(m, dict) and m.get("link") and isinstance(m.get("resolved"), str)}
                          for key in pkgs:
                              # an npm workspace member is covered only when the ROOT manifest
                              # declares it (workspaces globs) AND the lock links to it -- a
                              # handcrafted lock key alone grants nothing
                              nk = os.path.normpath(key)
                              if key and "node_modules/" not in key and not nk.startswith("..") and nk in link_targets \
                                      and ws_selected(nk):
                                  covered.add(os.path.normpath(os.path.join(rel, nk)))
                      except (ValueError, OSError):
                          pass                                                 # the verifier step rejects an unparseable lock
                  else:
                      refused.append(os.path.join(rel, "package-lock.json"))
              if "pnpm-lock.yaml" in files:
                  if "pnpm" in ACCEPT:
                      covered.add(rel)
                      lock = yaml.safe_load(open(os.path.join(root, "pnpm-lock.yaml"))) or {}
                      for imp in (lock.get("importers") or {}):
                          covered.add(os.path.normpath(os.path.join(rel, imp)))
                  else:
                      refused.append(os.path.join(rel, "pnpm-lock.yaml"))
              for f in ("yarn.lock", "bun.lock", "bun.lockb"):
                  if f in files:
                      refused.append(os.path.join(rel, f))
          # Cargo manifests: a Cargo.toml is covered only if it is a package of the
          # workspace that some Cargo.lock actually locks (cargo metadata --locked from
          # that lock's directory; an ancestor lock does NOT cover a nested standalone
          # project -- Codex round 2). Refused outright if this gate does not validate Cargo.
          import json, subprocess
          cargo_manifests, cargo_locks = [], []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in PRUNE]
              rel = os.path.normpath(root)
              if "Cargo.toml" in files: cargo_manifests.append(os.path.normpath(os.path.join(rel, "Cargo.toml")))
              if "Cargo.lock" in files: cargo_locks.append(rel)
          cargo_covered = set()
          if "cargo" in ACCEPT:
              for d in cargo_locks:
                  r = subprocess.run(["cargo", "metadata", "--format-version", "1", "--no-deps", "--locked"], cwd=d, capture_output=True, text=True)
                  if r.returncode != 0:
                      print(f"::error::{d}/Cargo.lock: cargo metadata --locked failed (manifest/lockfile drift?)\n{r.stderr.strip()[:400]}"); sys.exit(1)
                  cargo_covered.add(os.path.normpath(os.path.join(d, "Cargo.toml")))   # the workspace root manifest itself
                  for pkg in json.loads(r.stdout)["packages"]:
                      cargo_covered.add(os.path.normpath(os.path.relpath(pkg["manifest_path"], ".")))
          if cargo_manifests and "cargo" not in ACCEPT:
              refused += cargo_manifests
          bad = [m for m in manifests if m not in covered]
          bad += [m for m in cargo_manifests if "cargo" in ACCEPT and m not in cargo_covered]
          manifests = manifests + (cargo_manifests if "cargo" in ACCEPT else [])
          if refused:
              print("::error::lockfile format(s) this gate does not validate -- add validation or remove them:")
              print("\n".join("  " + r for r in refused))
          if bad:
              print("::error::manifest(s) with no covering validated lockfile (not installed, not signature-audited, not source-checked):")
              print("\n".join("  " + b for b in bad))
          if refused or bad:
              sys.exit(1)
          print(f"all {len(manifests)} manifest(s) are covered by a validated lockfile")
          PY
      # Per Cargo project: the parsed source policy (registry crates or
      # (name, version) workspace members only; cargo metadata --no-deps --locked,
      # no download) runs BEFORE cargo fetch --locked resolves and
      # checksum-verifies the crates of THAT project.
      - name: Crate source policy + cargo fetch --locked (every Cargo.lock)
        run: |
          # .cargo/config(.toml) is parsed as TOML and may not override crate
          # sources, registries, or network transport (dotted keys included).
          python3 - <<'CCP'
          import os, sys, tomllib
          # .cargo/config(.toml) can redirect crate fetching (source replacement,
          # registries, registry.default, net.git-fetch-with-cli...) without touching
          # Cargo.toml/Cargo.lock. Parsed as TOML (dotted keys included), any of those
          # top-level tables is refused; benign tables (env, build, test, alias...) pass.
          FORBIDDEN = {"source", "registries", "registry", "net", "http"}
          bad = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in ("node_modules", "target", ".git")]
              if os.path.basename(root) != ".cargo": continue
              for f in ("config", "config.toml"):
                  if f in files:
                      p = os.path.join(root, f)
                      try: cfg = tomllib.load(open(p, "rb"))
                      except tomllib.TOMLDecodeError as e: bad.append(f"{p}: unparseable TOML ({e})"); continue
                      hit = sorted(FORBIDDEN & set(cfg))
                      if hit: bad.append(f"{p}: overrides {', '.join(hit)} -- crate sources/registries/network may only come from Cargo.toml + Cargo.lock")
          if bad:
              print("::error::Cargo configuration overrides are not allowed:"); print("\n".join("  " + b for b in bad)); sys.exit(1)
          print("no Cargo source/registry/network overrides in any .cargo/config")
