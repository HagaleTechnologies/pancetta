          # current sparse-protocol index. A manifest dependency can set the stable
          # `registry-index` key directly (bypassing the separate .cargo/config.toml
          # guard entirely, since this is a Cargo.toml-level override, not a config
          # file one) to point Cargo at an arbitrary registry, including a plaintext
          # http:// one; `src.startswith("registry+")` alone accepts that unchanged
