                      if isinstance(job.get("uses"), str): add(job["uses"], job_level=True)
                      if isinstance(job.get("steps"), list): steps(job["steps"])
                      # an expression-valued image (`${{ matrix.image }}`, inputs, vars) is
                      # unchanged text whose VALUE a PR can change elsewhere, so base/head
                      # would cancel: it cannot be verified and fails closed at HEAD
                      # (Codex round 8). Write the digest-pinned image literally.
                      def image(v, what):
                          c = image_ref(v)
                          if c and "${{" in c:
                              if rev == head: HARD_FAIL.add(f"{manifest_path or 'workflow'}: {what} image is an expression ({c[len('container:'):]}) -- the gate cannot verify what it resolves to; write the @sha256-pinned image literally")
                              return
                          if c: acc[c] += 1
                      image(job.get("container"), "job container")
                      svcs = job.get("services")
                      if isinstance(svcs, dict):
                          for name, sv in svcs.items(): image(sv, f"service `{name}`")
              runs = doc.get("runs")
              if isinstance(runs, dict):
                  if isinstance(runs.get("steps"), list): steps(runs["steps"])
                  img = runs.get("image")
                  if isinstance(img, str) and img.startswith("docker://"):
                      if "${{" in img:
                          if rev == head: HARD_FAIL.add(f"{manifest_path or 'action'}: runs.image is an expression ({img.strip()}) -- write the @sha256-pinned image literally")
                      else: acc[img.strip()] += 1
                  elif isinstance(img, str) and img.strip():
                      # Dockerfile-backed action: GitHub builds it, so its FROM images run (round 3)
                      df = os.path.normpath(os.path.join(os.path.dirname(manifest_path), img.strip()))
                      txt = show(rev, df)
                      if txt is None: print(f"::error::action {manifest_path} references missing {df}"); acc["MISSING:" + df] += 1
                      else:
                          for c in dockerfile_images(txt, HARD_FAIL if rev == head else None, df): acc[c] += 1
          def refs_at(rev, path):
              acc = Counter()
              b = os.path.basename(path).lower()
              if b.startswith("dockerfile") or b.endswith(".dockerfile") or path in referenced_at(rev):   # per revision: what EXECUTES there
                  txt = show(rev, path)
                  if txt is not None:
                      for c in dockerfile_images(txt, HARD_FAIL if rev == head else None, path): acc[c] += 1
                  return acc
              doc = load(rev, path)
              if doc is not None: refs_of(rev, doc, acc, frozenset({path}), 0, path)
              return acc
          fail = 0; new = Counter()
          for mpath in sorted(set(manifests_at(head)) | referenced_at(head)):
              if is_symlink(head, mpath) and mpath not in SYMLINKED:
                  print(f"::error::{mpath} is a symlink -- executable manifests and action image files must be real files (a change to the target would otherwise escape review)"); SYMLINKED.add(mpath)
          for b, h in changed_pairs():
              if h is None: continue                               # deleted file: nothing new runs
              new += refs_at(head, h) - (refs_at(base, b) if b else Counter())   # per file, per occurrence
          if SYMLINKED: fail = 1
          for msg in sorted(HARD_FAIL): print(f"::error::{msg}"); fail = 1
          for ref in sorted(new):            # one verdict per distinct ref (a ref reached via a local action AND its own changed manifest is reported once)
              if ref.startswith("MISSING:"): fail = 1; continue
              if ref.startswith("HagaleTechnologies/"): continue
              if ref.startswith(("docker://", "container:")):
                  if re.search(r"@sha256:[0-9a-f]{64}$", ref): print(f"pinned by digest: {ref}")
                  else: print(f"::error::image without an immutable @sha256 digest: {ref}"); fail = 1
                  continue
              if "@" not in ref: print(f"::error::unpinned action (no @version): {ref}"); fail = 1; continue
