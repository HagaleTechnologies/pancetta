              """[(base_path|None, head_path|None)] rename-aware, NUL-safe."""
              _, raw = sh("git", "diff", "-z", "--name-status", "-M", base, head, "--", ".")
              raw = raw.split("\0"); pairs, i = [], 0
              while i < len(raw) and raw[i]:
