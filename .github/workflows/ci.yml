name: CI

on:
  # No `paths:` filter here — branch protection requires the `CI` job below,
  # and a required check that never triggers for a given diff (e.g. a
  # docs-only PR) permanently blocks that PR's merge (GitHub does not treat
  # "workflow never ran" as "check passed"). Path-based skipping happens
  # per-job below instead, via the `changes` job, so the required `CI`
  # aggregator always runs and always reports.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly drift check (Mondays 12:00 UTC). Catches toolchain bumps,
    # advisory drops, and platform regressions even when no human pushes
    # land. The full lane runs on schedule so the catch-up isn't gated
    # behind a PR.
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # pull-requests: read is narrowed further at the job level below
  # (codex-clean) -- a job's own permissions: block can only be a SUBSET
  # of what's granted here, never wider. Without this scope present at
  # this top level, GitHub rejects the whole workflow file at parse time
  # (zero jobs created, no per-job error) the moment that job requests a
  # scope this block doesn't grant.
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

# Job gating policy (revised 2026-07-21):
#
# CI is the AUTHORITATIVE gate. The heavy lanes now run on every PR AND every
# push to main, so `main` is comprehensively gated regardless of how a change
# lands (PR merge or — if ever enabled — a direct push). This replaced the old
# "skip heavy lanes on direct push; the pre-push hook covers it" policy: the
# local pre-push hook (scripts/check.sh) is now a FAST pre-flight (~5 min) and
# defers the full test run + examples build to CI here. See scripts/check.sh.
#
#   - clippy + fmt + ft8-tests + workspace-check + deny: every PR + every push
#     to main + schedule (weekly drift) + manual dispatch — but SKIPPED (not
#     unfiltered) on docs/report-only diffs via the `changes` job below, so
#     that traffic doesn't spend CI minutes while the required `CI` check
#     still always runs and reports (see the `on:` comment above for why this
#     replaced top-level `paths:` filtering).
#   - cross-platform-check: PR + schedule + dispatch only (macos runners ~10x
#     cost; not worth gating every main push), same code-changed gate.

jobs:
  # Detects whether this push/PR touches anything the heavy lanes below care
  # about. Deliberately has no `paths:`/`if:` restriction of its own — it must
  # always run so its output is always available to gate the other jobs.
  changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Only meaningful for push/pull_request (a real base ref to diff
      # against exists). schedule/workflow_dispatch have no natural base;
      # those events already force every downstream job to run regardless
      # of this output (see each job's `if:`), so skipping here is safe —
      # `steps.filter.outputs.code` is just empty, not a failure.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.github/workflows/ci.yml'

  # codex-clean gate: defers the heavier lanes below (ft8-tests,
  # workspace-check, cross-platform-check, deny) until wait-for-codex.yml
  # signals this exact revision's Codex round raised nothing new. clippy
  # and fmt stay ungated (fast, ~2min, immediate feedback regardless of
  # review-round status). Self-contained (no external `uses:` call) since
  # this repo is public. gate_timeout_minutes is fixed at 95, derived from
  # this repo's OWN wait-for-codex job (75min timeout / 70min in-script
  # poll bound, see wait-for-codex.yml).
  codex-clean:
    name: Codex review clean (gate before expensive downstream jobs)
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: read
      pull-requests: read
    # exclude_dependabot + draft-PR skip, mirroring wait-for-codex.yml's own
    # eligibility check -- belt-and-suspenders against that producer-side
    # skip logic ever drifting from this consumer-side one.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.draft == false
    steps:
      - name: "Bootstrap check: does the base branch have wait-for-codex.yml's label mechanism yet?"
        id: bootstrap-check
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # wait-for-codex.yml is pull_request_target, which ALWAYS
          # executes the BASE branch's copy, never the PR's own -- so the
          # PR that first wires this mechanism up can never produce a
          # label for its own pushes until it merges. Pinned to base.sha
          # (the event-fixed commit), not base.ref (a moving branch tip).
          #
          # A clean HTTP 404 (the file genuinely doesn't exist at this
          # SHA -- this IS the bootstrap PR) is the ONLY fetch-side
          # outcome allowed to pass through; every OTHER fetch failure
          # (transient network error, 403, 5xx) fails the gate closed
          # rather than silently treating a real API problem as "not
          # live yet, skip."
          err_file="$(mktemp)"
          if gh api "repos/$REPO/contents/.github/workflows/wait-for-codex.yml?ref=$BASE_SHA" --jq '.sha' >/dev/null 2>"$err_file"; then
            echo "bootstrap_status=ready" >> "$GITHUB_OUTPUT"
          else
            err="$(cat "$err_file")"
            if echo "$err" | grep -qiE "HTTP 404|not found"; then
              echo "::warning::Base branch has no wait-for-codex.yml at $BASE_SHA (clean 404) -- this is the bootstrap PR itself. Passing through unconditionally."
              echo "bootstrap_status=absent" >> "$GITHUB_OUTPUT"
            else
              echo "bootstrap_status=fetch-failed" >> "$GITHUB_OUTPUT"
              echo "::error::Could not determine whether base branch has wait-for-codex.yml (non-404 failure fetching $BASE_SHA, failing closed): $err"
              exit 1
            fi
          fi

      - name: Pass through -- not a synchronize event, or bootstrap not yet live on the base branch
        if: github.event.action != 'synchronize' || steps.bootstrap-check.outputs.bootstrap_status == 'absent'
        run: echo "Passing through (event action=${{ github.event.action }}, bootstrap_status=${{ steps.bootstrap-check.outputs.bootstrap_status }}) -- no prior round to converge on, or this is the bootstrap PR itself."

      - name: Poll for the codex-clean label on this exact revision
        if: github.event.action == 'synchronize' && steps.bootstrap-check.outputs.bootstrap_status == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          target="codex-clean:${HEAD_SHA:0:12}"
          # In-script deadline runs a fixed 7-minute margin under this
          # job's own 95-minute timeout-minutes, leaving slack for the
          # loop to notice and error out cleanly before GitHub kills the
          # job outright.
          END=$((SECONDS + 95 * 60 - 420))
          while [ $SECONDS -lt $END ]; do
            # per_page=100: labels accumulate one per round with no
            # cleanup (deleting a stale label is itself a race that can
            # delete a newer revision's already-valid one), so a long
            # review loop can push the current label past the REST
            # default page size of 30.
            if labels=$(gh api "repos/$REPO/issues/$PR/labels?per_page=100" --jq '[.[].name]' 2>/dev/null); then
              if echo "$labels" | jq -e --arg l "$target" 'index($l) != null' >/dev/null 2>&1; then
                echo "Found $target -- this round raised nothing new, safe to run the jobs gated behind this one."
                exit 0
              fi
            fi
            echo "Still waiting for $target..."
            sleep 20
          done
          echo "::error::$target never appeared within the gate's timeout budget -- this revision's Codex round either hasn't converged or the label failed to apply. See wait-for-codex.yml's own run for this SHA."
          exit 1

  # Fast checks — run on every push and PR (~2 min)
  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy

      - name: Clippy (workspace)
        # pancetta-research is a local-only iteration harness (CLAUDE.md): never
        # built in CI. Excluded explicitly so its research internals never gate
        # or ship through the public CI lane.
        run: cargo clippy --workspace --exclude pancetta-research --features transmit

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # FT8 crate checks + tests — runs on every PR and every push to main
  # (plus weekly schedule + manual dispatch). Part of the authoritative gate.
  ft8-tests:
    name: FT8 Tests
    needs: [changes, codex-clean]
    # codex-clean can legitimately report `skipped` (a draft PR,
    # dependabot[bot] PR, or non-pull_request event -- see codex-clean's
    # own eligibility `if:` above), which is different from "ran and
    # found the round not clean yet" (that produces `failure`). Both
    # `success` and `skipped` mean "proceed."
    if: (needs.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (needs.codex-clean.result == 'success' || needs.codex-clean.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ft8-tests

      - name: Check (no features)
        run: cargo check -p pancetta-ft8

      - name: Check (transmit feature)
        run: cargo check --features transmit -p pancetta-ft8

      - name: Run FT8 tests (all features)
        run: cargo test --features transmit -p pancetta-ft8

  workspace-check:
    name: Workspace Check
    needs: [changes, codex-clean]
    if: (needs.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (needs.codex-clean.result == 'success' || needs.codex-clean.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      # This lane links the whole workspace THREE times (check, examples,
      # tests). Each test/example binary statically links a large dep tree,
      # and the workspace ships dozens of example binaries. With full
      # debuginfo the accumulated target/ exhausted the runner's disk during
      # linking on a cold cache — `ld` died with SIGBUS (ENOSPC on its
      # mmap'd output) on 2026-06-13. line-tables-only keeps file:line in
      # backtraces while dropping ~70-80% of debuginfo size, for both the
      # dev profile (examples) and the test profile (integration tests).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Reclaim ~25-30 GB of preinstalled tooling the runner ships but this
      # lane never uses. Pairs with the reduced debuginfo above to keep the
      # cold-cache full-workspace build comfortably under the disk ceiling.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          df -h /

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace-check

      - name: Check workspace
        # Exclude the local-only research harness (CLAUDE.md): its sources and
        # examples are never built in CI.
        run: cargo check --workspace --exclude pancetta-research

      - name: Build examples
        run: cargo build --workspace --exclude pancetta-research --examples

      - name: Test workspace
        run: cargo test --workspace --exclude pancetta-research --features transmit

  # Cross-platform compile check. Pancetta targets Linux/macOS/Windows
  # (development on Mac, production on Windows MiniPC), so a Linux-only
  # CI lane silently lets platform regressions land. Check-only (not test)
  # to keep wall-clock manageable. PR + weekly cron + manual dispatch
  # (skipped on direct human push to main; macos minutes are 10x cost).
  cross-platform-check:
    name: Cross-Platform Check (${{ matrix.os }})
    needs: [changes, codex-clean]
    if: ((github.event_name == 'pull_request' && needs.changes.outputs.code == 'true') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (needs.codex-clean.result == 'success' || needs.codex-clean.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        # windows-latest dropped 2026-05-23: MSVC can't compile the
        # variable-length arrays in vendor/ft8_lib/ft8/decode.c
        # (error C2057). The pancetta-ft8 build script invokes cc on
        # the C sources, and MSVC is stricter than gcc/clang about
        # VLA support (only allowed with /experimental:c11atomics, and
        # even then not reliably). Patching upstream ft8_lib is out of
        # scope; on-rig builds use the MinGW toolchain on the Windows
        # MiniPC, not MSVC. Re-add windows-latest if the upstream
        # ft8_lib drops VLAs.
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.os }}

      # default-members excludes pancetta-hamlib; the rigctld TCP path is
      # exercised on Linux and the bundled FFI bindings are dead code. The
      # other crates must compile on all three platforms.
      - name: Check workspace (default members)
        run: cargo check

  # cargo-deny enforces license whitelist, banned-crate-source policy,
  # multi-version warnings, AND RustSec advisories — the latter subsumes
  # what cargo-audit would do separately. Single source of truth in
  # deny.toml, including any documented advisory ignores. Runs on every PR and
  # every push to main (part of the authoritative gate).
  deny:
    name: Cargo Deny
    needs: [changes, codex-clean]
    if: (needs.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (needs.codex-clean.result == 'success' || needs.codex-clean.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories

  # Summary gate for branch protection. A single "CI" check covers the core
  # lanes so branch-protection only needs to require one check name.
  ci:
    name: CI
    # codex-clean added: if it genuinely fails (round not converged), the
    # jobs it gates report `skipped` (not `failure`), which the
    # failure|cancelled grep below wouldn't otherwise catch on its own --
    # codex-clean's own result flows into the SAME toJSON(needs.*.result)
    # string via this needs: entry, so a real gate failure still fails CI.
    needs: [clippy, fmt, ft8-tests, workspace-check, deny, codex-clean]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All CI checks passed
        run: |
          results='${{ toJSON(needs.*.result) }}'
          if echo "$results" | grep -q '"failure"\|"cancelled"'; then
            echo "One or more required CI jobs failed"
            exit 1
          fi
          echo "All required CI jobs passed"
