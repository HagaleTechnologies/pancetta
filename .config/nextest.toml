# Only the known wall-clock decoder budgets get a retry in CI.
[profile.ci]
retries = 0
flaky-result = "pass"

[test-groups.real-time-budget]
max-threads = 1

# Mock rig tests must not run concurrently within a partition.
[test-groups.hamlib]
max-threads = 1

[[profile.ci.overrides]]
filter = "package(=pancetta-ft8) & binary(=wav_decode_tests) & test(=test_decode_within_realtime_budget)"
test-group = "real-time-budget"
retries = 1

# Wall-clock decode results: these tests run alone on the runner.
# `pan318_overlap_tests` decodes under the 250 ms Standard budget and
# compares overlapped vs sequential entry timings by design.
# `station_max_preset_decodes_like_the_station` (no DecodeBudget) and
# `subtraction_recall_superset` (`DecodeBudget::unlimited()`) decode two
# passes, but `decode_window` still applies its legacy call-anchored 2 s
# BudgetTracker (`decoder.rs`, `BudgetTracker::new`), so under CPU
# contention pass 0 overruns 2 s, pass 1 is skipped and CQ UW5EJX/MM is
# lost. Under nextest's cross-binary parallelism all three fail
# (station_max 12/12, overlap 5/12 of concurrent copies locally;
# subtraction_recall_superset 2/2 full runs on 32 cores, PAN-487);
# alone they pass.
[[profile.ci.overrides]]
filter = "package(=pancetta-ft8) & (binary(=pan318_overlap_tests) | binary(=subtraction_recall_superset) | (binary(=encode_split_test) & test(=station_max_preset_decodes_like_the_station)))"
threads-required = "num-cpus"
retries = 1

# Replays WAVs through the real binary on a PTY and requires exit within
# 10 s of the confirmed quit; under partition-wide CPU contention the
# replay decode overruns that window (PAN-314 validate, partition 1).
[[profile.ci.overrides]]
filter = "package(=pancetta) & binary(=tui_lifecycle) & test(=pan333_normal_quit_restores_terminal_and_exits_zero)"
threads-required = "num-cpus"
retries = 1

[[profile.ci.overrides]]
filter = "package(=pancetta-hamlib)"
test-group = "hamlib"
