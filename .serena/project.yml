# Serena project definition for pancetta (PAN-77).
#
# Committed so the catalyst-dev codebase-analyzer / codebase-locator /
# codebase-pattern-finder subagents get real symbol search here instead of
# silently falling back to grep. The machine-local halves (the generated index
# cache, an optional project.local.yml override) are gitignored — see
# .serena/.gitignore.
project_name: "pancetta"
encoding: "utf-8"
ignore_all_files_in_gitignore: true
ignored_paths:
# Serena's own generated index cache.
- ".serena/cache"
# Restated explicitly even though .gitignore:4 covers it: target/ routinely
# reaches 40-50 GB in this repo (AGENTS.md "Build Hygiene") and is worth a
# config-level guarantee independent of gitignore parsing.
- "target"
# A SYMLINK OUT OF THE REPO to the shared thoughts store (.gitignore:188), not a
# real directory. Excluded so Serena's directory walker cannot follow it into the
# externally-mounted pool.
- "thoughts"
# Orchestrator/runtime state, not project source. Only specific files under it
# are gitignored today (.gitignore:180-182), so the directory needs its own entry.
- ".catalyst"
# Transient parallel-work checkouts (.gitignore:91), not canonical source.
- ".worktrees"
# 3.8 MB of demo media (WAV/PNG/GIF/SVG) at the repo root, plus one README
# under demo-wav/ — no symbols, negligible text value. Anchored with a leading
# slash: a slash-less entry also matches at any depth under gitignore
# semantics, which would silently de-index
# pancetta-ft8/assets/neural_osd_weights.provenance.json too — a real text
# file inside a workspace crate, not root-level demo media.
- "/assets"
# Vendored upstream C reference decoder (git submodule, .gitmodules:1-3; usually
# uninitialized). Different language, not code contributors edit.
- "pancetta-ft8/vendor/ft8_lib"
read_only: true
initial_prompt: |
  pancetta: autonomous FT8 ham radio station in Rust — decode, call, complete
  QSOs, and log, with priority-based station selection, multi-stream TX, and
  cqdx.io integration. 14-crate Cargo workspace, layered: pancetta-core /
  -audio / -dsp / -config / -agent have no internal deps; pancetta-ft8 / -qso /
  -hamlib / -dx / -cqdx / -tui / -protocol build on them; the `pancetta` binary
  (coordinator, message bus, runtime) depends on all. Read AGENTS.md first —
  especially its "Key Invariants" section — then docs/DECISIONS/ (subsystem
  decision digests) and docs/ARCHITECTURE.md before broad exploration;
  wiki/INDEX.md maps accumulated gotchas. Prefer Serena's get_symbols_overview /
  find_symbol / find_referencing_symbols over raw grep for symbol-level
  questions; call read_memory("codebase_map") for the directory map.
  pancetta-ft8/vendor/ft8_lib is a vendored upstream C reference decoder (git
  submodule, usually uninitialized) and is outside this project's index.
default_modes:
added_modes:
excluded_tools: []
included_optional_tools: []
fixed_tools: []
symbol_info_budget:
language_backend:
line_ending:
read_only_memory_patterns: []
ignored_memory_patterns: []
ls_specific_settings: {}
ls_additional_workspace_folders: []
# Workspace folders indexed for symbol search; "." covers the whole repo. Set
# explicitly (rather than left absent) because an absent key is what
# triggered Serena's one-time schema migration that stripped this file's
# rationale comments on first activation — see PAN-77 header above.
ls_workspace_folders:
- .
# No pre-activation shell setup needed for a pure-Rust workspace; left unset.
activation_command:
activation_command_timeout: 180.0
# `language_servers` (not the legacy `languages` key Serena migrates away
# from) so a fresh activation is idempotent and never rewrites this file.
language_servers:
- rust
